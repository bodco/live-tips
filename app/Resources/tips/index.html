<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pacenote</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="tips.css">
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header class="bar">
      <span class="rec" id="rec" aria-hidden="true"></span>
      <span class="timer" id="timer">00:00</span>
      <span class="status" id="status"></span>
      <span class="spacer"></span>
      <button class="onme" id="onmeBtn" type="button"><span id="onmeLbl"></span><span class="n" id="onmeN">0</span></button>
      <button class="icon-btn" id="moreBtn" type="button" aria-haspopup="menu" aria-label="More">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="4" cy="9" r="1.5" fill="currentColor"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/><circle cx="14" cy="9" r="1.5" fill="currentColor"/></svg>
      </button>
    </header>

    <section class="agenda" id="agenda" aria-label="Agenda">
      <div class="segs" id="segs" aria-hidden="true"></div>
      <div class="cap"><span id="agendaNow"></span><span id="agendaMissing"></span></div>
    </section>

    <section class="empty" id="empty" hidden aria-live="polite"></section>
    <section class="after" id="after" hidden aria-label="After the call"></section>
    <section class="present" id="present" hidden aria-live="polite"></section>
    <article class="hero" id="hero" aria-live="polite" hidden></article>

    <section class="earlier" id="earlier" aria-label="Earlier"></section>

    <div class="next" id="next" hidden></div>

    <form class="ask" id="ask">
      <label>
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true" style="color:var(--text-3)"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l3.5 3.5"/></svg>
        <span class="sr" id="askLbl"></span>
        <input id="askInput" type="text" aria-labelledby="askLbl">
      </label>
      <button class="help" id="helpBtn" type="button"><span id="helpLbl"></span><span class="k" id="helpKey"></span></button>
    </form>
  </div>

  <aside class="pane" id="pane" aria-label="Side panel"></aside>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="menu" id="menu" hidden role="menu"></div>
<div class="popover" id="pop" hidden role="dialog"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="feed.js"></script>
<script src="tips.js"></script>
</body>
</html>
