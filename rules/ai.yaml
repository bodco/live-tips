# Ways to a model per job (Pacenote 0.8.5). Shared by the app and the engine.
schema_version: 1
routes:
  code: the PM's Claude account through Claude Code (the plan's limits, no key)
  api: the Claude API key through Claude Code or the API (billed per token)
  codex: |
    ChatGPT account through the official Codex CLI (forced_login_method=chatgpt), never API-key credentials.
    Available for prep, tips and after. The CLI handles browser login and token storage; Pacenote checks
    login status but never reads or copies auth.json. Requests use an empty temporary working directory,
    ephemeral sessions, ignored user config, read-only sandbox, no approvals, shell, web search, MCP,
    plugins, hooks, memories or subagents. Prompts go through stdin; stderr and credentials are not logged.
    The default Codex model is used (codex/default in the ledger); plan usage is not billed to an API key.
    No automatic provider switching. For prep, livetips_m0.codexprep uses the localprep context pack and
    prompt contracts; Pacenote writes and checks the output files itself and restores the previous prep
    on failure. Live tips keep the local cards and search; the deep folder lookup follows the preparation (deep_lookup).
  openai: |
    OpenAI API key from macOS Keychain (OPENAI_API_KEY in the child process only), the job's OpenAI model (Settings > AI; defaults gpt-6-luna for tips, gpt-6.1-sol for preparation and after the call) through the
    streaming Responses API with reasoning effort none and store false. Available for tips, after-call jobs and,
    from 0.9.0, the preparation (livetips_m0.openaiprep: the same context pack and passes as the ChatGPT account
    route, Pacenote writes and checks the files and restores the previous prep on failure). No automatic fallback from OpenAI to Claude or local. Live-call
    spending limits apply; cached input tokens are counted separately from uncached input. With tips on OpenAI the
    deep folder lookup follows the preparation's way (deep_lookup); the local project search and prepared cards remain.
    Incomplete, refused, failed or unterminated streams are errors, with one exception (0.9.2, audit of a 04.11 call:
    Luna closed its JSON and ran on to the output limit, 14 of 98 classify and 3 of 24 tip answers were lost): an
    answer cut by the output limit (incomplete_details.reason max_output_tokens) whose text starts with a whole JSON
    object keeps that object; the rest is cut and counted as `tail`. Cut without a whole object, it is asked once more
    with three times the limit (2,400 at most); both requests are billed. A tip whose text has letters of a script no
    call language uses, or a stray token like _REALTYPE, is dropped (tip_invalid, garbled). The llm log keeps the
    reasoning tokens, the incomplete reason, the retry, the tail and the route of every request, and run.json names the
    route and the model each role really used (models, routes; observed and models_match after the call).
    No tools or saved sessions.
  gemini: |
    0.9.3 (owner, 2026-11-04): Gemini API key from macOS Keychain (GEMINI_API_KEY in the child process only), the job's
    Gemini model (Settings > AI; defaults gemini-3.5-flash-lite for tips, gemini-3.8-flash for preparation and after
    the call) through the classic streamGenerateContent endpoint (stateless: no stored interactions, no tools, no
    files, no cached-content objects; the key goes in the x-goog-api-key header, never the URL). Paid tier only by
    design: Google uses free-tier content to improve its products and not paid-tier content. Thinking cannot be off
    for these models: the lowest level is sent (minimal for Flash-Lite, low for Flash and Argon) and billed as output.
    maxOutputTokens counts the thinking too, so the answer limit gets room on top (128 for minimal, 512 for low).
    Caching is implicit (a stable prefix of 4,096 tokens or more, no write charge). An answer cut by the output limit
    follows the OpenAI rules (a whole JSON object at the start is kept, otherwise asked once more with three times
    the limit). Errors name only the status and a string code, never the message. No automatic fallback from a
    chosen Gemini to Claude, OpenAI or local. Available for tips, after-call jobs and the preparation
    (livetips_m0.geminiprep). With tips on Gemini the deep folder lookup follows the preparation's way (deep_lookup).
  agy: |
    0.9.3 (owner, 2026-11-05): the Gemini account through Google's Antigravity CLI (agy), for the preparation and the
    after-the-call jobs only: a request takes 20-30 s however small (measured 2026-11-05), too slow for tips. One
    print-mode run per request (livetips_m0.agy_provider): the prompt on stdin, --output-format json, --sandbox,
    --disable-slash-commands, --model <agy id, default gemini-3.8-flash-medium>, an empty temporary working folder (agy
    reads files in its working folder without asking), no API key in the environment (the signed-in account pays).
    Reading outside the folder, writing and shell commands are denied in print mode; a denied action with no answer
    is an error, as is a status other than SUCCESS. agy keeps every conversation under ~/.gemini/antigravity-cli
    (brain/<id>, annotations/<id>.pbtxt); Pacenote removes the ones it made, by id, and nothing else. No API price
    (paid by the plan). No automatic switch from a chosen agy. Plan B for those jobs when no Gemini key is set.
    Settings shows a red warning when it is chosen: Google's Antigravity terms (antigravity.google/terms, read
    2026-11-05) forbid using the service through third-party software, with suspension of the account as the stated
    consequence, and let Google use and review Interactions (Telemetry off does not stop storage).
  gemini_fallback: |
    0.9.3 (owner): plan B, off by default (Settings > AI > Automatic switching). With it on and a Gemini key set, a job
    whose chosen way is out (no credit, plan limit, bad key, not signed in; a plain rate limit or a timeout is not an
    outage) goes to Gemini: after the other Claude way when auto-switch is on, before the model on this Mac. Tips
    during a call switch too. The out way is checked again as before and the job goes back to it once it answers.
    The text of the call then reaches Google, so the switch is the PM's explicit choice; it is never on by default.
  local: |
    0.8.5 (owner): a preparation on this Mac through Ollama (Settings > AI > Preparation, model gemma4:26b by
    default). A local model reads files poorly by itself, so the engine (livetips_m0.localprep) builds one context
    pack and asks once: the call context, the files the PM added, the project config, the last 3 calls of this
    meeting, the Current State page of the Notion mirror, `lt digest` for 14 days, the folders the PM added; about
    120,000 characters at most, num_ctx 65,536. Three passes (0.8.5, owner: closer to Sonnet): (1) notes of each
    earlier call of the meeting (discussed with quotes, questions answered or not, action items, promises, concerns,
    open items); (2) the brief, every section of sweep.md in the order and depth of a Claude brief, from the notes and
    the pack, in the PM's language; (3) the speech with a full text under every point (speech.md), then the cards and
    the facts with sweep.md's card and fact rules. Then `lt prep-check`. Nothing leaves the Mac. Chosen by hand only.
  local_jobs: |
    0.8.5 (owner: local models in every model list): After the call can also run On this Mac (summary, meeting
    page, follow-up, memory, rehearsal) through livetips_m0.providers.OllamaProvider (/api/chat, num_ctx 65,536);
    the model is the one chosen in Settings (LT_LOCAL_MODEL, shared with the preparation). Tips during a call never
    run locally: too slow, and the call needs the memory. Settings > AI shows Ollama's state with one action: Get
    Ollama, Start Ollama, Install Gemma 4 26B (Ollama's /api/pull with progress), then the installed models.
    Every local pass has an output cap and a repeat penalty (a pass once looped for 25 minutes).
  claude_tools: |
    0.8.5: Claude Code was refused `lt digest` and `lt prep-check` in every run; the app now makes <base>.digest.md
    right before Claude starts and runs `lt prep-check --fix` after it; Claude reads the digest with Read.
deep_lookup: |
  2026-11-06 (owner): a typed question or HELP NOW with no ready answer (a typed question without "answered": true)
  starts a search of the project folder and every folder added to the call, on every AI way, in the background; the
  answer comes as a new card. The preparation runs on Claude (account or key) and Claude Code is installed: read-only
  Claude Code (Read, Grep, Glob) over the folders, as since 0.6.2. Any other way: the engine searches the folders
  itself (lt search, several queries, wide passages) and the preparation's model answers from the passages; only the
  question, the last call lines and the passages go to that provider. At most 2 at a time and 12 per call; spending
  limits apply. No folders: no search, the card says there is no ready answer.
call_agent: |
  0.9.6 (owner, 2026-11-06): opt-in (Settings > AI > Call agent, off by default). When on, the deep_lookup above goes
  first to one Claude Agent SDK session per call (livetips_m0.agent): the model set there (Sonnet by default, Haiku
  for less), Read, Grep and Glob over the project folder and the added folders, and with "Pacenote's own tools" the
  in-process tools of livetips_m0.pn_tools (0.9.6 Б2, one list for the agent and the preparation): brief and
  call_transcript (live call only), search_folders (lt search), past_calls (the last calls: notes, else the call's last
  picture, else the transcript's start and end; with a query also matching passages), commitments (the open promises
  register), decisions (the register snapshot plus decisions from later calls, newer wins, superseded dropped) and
  project_state (the Notion current state with its date); each answers short dated lines with a source, "(no data)"
  when there is none; the agent is told to call the cheapest first. Bash, writes, the web and
  subagents are removed, anything else is denied; no user or project settings, skills or MCP servers
  (setting_sources []); Claude Code gets its own config folder (state/agent-claude), so only the Claude API key pays,
  never the Claude account (Anthropic's terms for products built on the SDK). Each question sends only the call lines
  the session has not seen. Limits: $0.30 per question (max_budget_usd), 12 turns, 120 s, $1 per call by default
  (Settings); the cost is the SDK's session total minus the previous one, written to spend-ledger.jsonl as job
  "agent" (Usage: live, Claude). Not used, and the deep_lookup above answers: flag off,
  no SDK (optional component "agent": setup.sh install agent, Python 3.10+), no Claude key, Claude at its monthly
  limit, the call's agent budget spent, or the agent failed (its spend still counts).
  Background searches (point 2, owner 2026-11-06): flag agent.proactive, off by default (Settings > AI > Call agent >
  Background searches). Trigger: the call picture finds a new question of the other side to the PM (asks, type
  question) while a brief exists and the brief plus the fact book do not cover it (engine.brief_covers: under 60% of
  its content words by a 5-letter stem). The same session gets a BACKGROUND CHECK prompt (ask(background=True)): at
  most 3 tool calls, 45 s, answered=false at once when the sources have nothing. Never queued: skipped while any
  question or deep lookup is in flight; a PM question interrupts it (its result is dropped). Limits per call:
  proactive_usd_per_call $0.25 and proactive_max_per_call 6, inside max_usd_per_call; proactive_gap_s 60 between two;
  one search per question text. Economy mode (checked explicitly, proactive_skip why economy), no key, Claude capped: no search. A card (kind answer, auto true)
  only when answered is true; llm rows proactive_lookup and proactive_skip (why: busy, gap, budget, in_brief); ledger
  rows job "agent" with background true.
prep_agent: |
  0.9.6 Б3-Б4 (owner, 2026-11-06), point 4, beta: the research preparation. Rules and defaults in rules/prep.yaml
  (that file wins over this summary). Three switches (Settings > AI > Preparation (beta)); tools on by default after the A/B, verify
  and parallel off: tools (livetips_m0.pn_mcp, the read-only part of pn_tools over stdio MCP), verify (livetips_m0.prepverify: Haiku, clean
  context; unverified -> " (unverified)", contradicted -> the wrong part replaced in place with the source's value plus
  "(corrected per <source> <date>)", nothing removed; original <base>.brief.preverify.md, result <base>.verify.json,
  ledger job prep_verify), parallel (up to 5 read-only `researcher` subagents through --agents). Only the Claude ways
  (api and code), both through `claude -p`; no Agent SDK for the preparation (owner, 2026-11-06). On api a budget per
  preparation (--max-budget-usd, $1.50 default) when tools or parallel are on; the checker $0.25. With the features on
  the preparation prompt's "no MCP tools ... no subagents" line names them instead (PrepAgent.adjust). Economy: tools
  yes, the checker on Haiku, no parallel. Defaults after the A/B (owner, 2026-11-06; research/
  pacenote-prep-agent-ab-2026-11-06.md): tools on, the checker and parallel off.
provider_limits: |
  0.9.6 (owner, 2026-11-06): a monthly limit (0 = none) and an alert share (80% default) per provider with a key:
  Claude (route api), OpenAI, Gemini, from spend-ledger.jsonl of the current month. Only providers with a key are shown
  and alerted. The alert share: one notification a month and an orange menu bar icon. The limit: the router treats
  that provider's way as not usable (livetips_m0.cost.ProviderCaps via sidecar-config provider_caps and
  LT_PROVIDER_CAPS; the preparation in PrepRunner too); with auto-switch Claude moves to the account, otherwise the
  request fails with "the monthly limit ... is reached". A limit is not an outage (the way is not marked down). The
  ledger is read at most every 30 s, so a request may pass the limit by one call.
economy: |
  0.9.6 Б1 (owner, 2026-11-06): economy mode v1 = the least API money, the accounts' plans pay where they can. Switched
  by hand only (menu bar leaf, shown with any API key; Settings > AI > Economy mode), the file state/economy.
  Live, read before every agent question, lookup and background search: the call agent on the ECONOMY profile
  (livetips_m0.agent: claude-haiku-5-5, 6 turns, $0.05 a question, min(setting, $0.25) a call; a profile change starts
  a new session, the spend stays); background searches off; the deep lookup without the agent runs Claude Code with no
  ANTHROPIC_API_KEY (deep_env economy, the Claude account), and on an error (signed out) local_lookup on the tips
  model; typed questions on the tips model (_ask_on_prep False). llm rows carry "economy": true (deep_lookup,
  call_agent_profile, deep_account_error), ledger rows too.
  From the next call or job (EconomyPlan.apply in LiveTipsCore/Spending.swift through AIRoute.effective: CallEngine
  config, AIRoute.env, sidecarBlock, PrepRunner): tips on the cheapest model of their way (api/code Haiku, openai
  gpt-6-luna, gemini gemini-3.5-flash-lite; classify untouched); prep and after: api -> code, openai -> codex when that
  account's tool is installed (a signed-out account falls back through auto-switch); gemini never to agy (Antigravity's
  terms); no account: after on the cheaper model (openai gpt-6-luna, gemini flash-lite; the Claude after-call models
  are fixed in the engine modules and stay), prep unchanged. Point 4 in economy (EconomyPlan.prepFeatures): tools yes,
  the checker on Haiku only, no parallel subagents. The monthly limits per provider apply on top (checked after).
ask_model: |
  2026-11-06 (owner): a typed question is answered by the preparation's way and model (Settings > AI) when that way
  answers in seconds: a Claude API key, the OpenAI API or the Gemini API. A Claude or ChatGPT account and the Gemini
  account keep typed questions on the tips model. The preparation's way out: the tips model answers. HELP NOW stays
  on the tips model (speed first). The quick answer searches the project folder and the added folders; HELP NOW
  searches them for the other side's last question.
fallback: |
  0.8.5 (owner: plan B when Claude is down): with "Use it when Claude does not answer" on (default), a preparation or
  an after-the-call job whose Claude ways are both out (no credit, plan limit, signed out, not installed) runs on the
  model on this Mac (Settings > AI > Model on this Mac). Measured quality is about 60% of Sonnet (docs 14.1g), so
  what it writes is read before use. Tips during a call never fall back: the local model answers in 19-59 s and
  bge-m3 is a search model that cannot write; when Claude is out during a call the instant cards and facts (bge-m3
  and keywords) still show.
prep_runs:
  rule: |
    0.8.5 (owner: compare preparations by time, price and quality): a full preparation (not a refresh) moves the
    previous one's files (brief.md, cards.json, facts.json, prep.json, brief.orig.md, brief.prev.md) out of the live
    folder to <appRoot>/prep-runs/<base>/<time>-before, so the new one starts clean and cannot read it; afterwards
    it copies what it wrote and run.json (route, model, started, duration_s, cost_usd, tokens, turns, sources, ok) to
    <appRoot>/prep-runs/<base>/<time>-<route>-<model>. The previous brief comes back as <base>.brief.prev.md
    (Restore previous version); a failed run puts the old files back.
  compare: tools/prep_compare.py <appRoot>/prep-runs/<base> prints one table (time, price, tokens, brief size,
    sections, speech points with full text, cards, facts) for a quality review
