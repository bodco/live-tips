# Ways to a model per job (Pacenote 0.8.5). Shared by the app and the engine.
schema_version: 1
routes:
  code: the PM's Claude account through Claude Code (the plan's limits, no key)
  api: the Claude API key through Claude Code or the API (billed per token)
  local: |
    0.8.5 (owner): a preparation on this Mac through Ollama (Settings > AI > Preparation, model gemma4:26b by
    default). A local model reads files poorly by itself, so the engine (livetips_m0.localprep) builds one context
    pack and asks once: the call context, the files the PM added, the project config, the last 3 calls of this
    meeting, the Current State page of the Notion mirror, `lt digest` for 14 days, the folders the PM added; about
    120,000 characters at most, num_ctx 65,536. Three passes (0.8.5, owner: closer to Sonnet): (1) notes of each
    earlier call of the meeting (discussed with quotes, questions answered or not, action items, promises, concerns,
    open items); (2) the brief, every section of sweep.md in the order and depth of a Claude brief, from the notes and
    the pack, in the PM's language; (3) the speech with a full text under every point (speech.md), then the cards and
    the facts with sweep.md's card and fact rules. Then `lt prep-check`. Nothing leaves the Mac. Chosen by hand only.
  local_jobs: |
    0.8.5 (owner: local models in every model list): After the call can also run On this Mac (summary, meeting
    page, follow-up, memory, rehearsal) through livetips_m0.providers.OllamaProvider (/api/chat, num_ctx 65,536);
    the model is the one chosen in Settings (LT_LOCAL_MODEL, shared with the preparation). Tips during a call never
    run locally: too slow, and the call needs the memory. Settings > AI shows Ollama's state with one action: Get
    Ollama, Start Ollama, Install Gemma 4 26B (Ollama's /api/pull with progress), then the installed models.
    Every local pass has an output cap and a repeat penalty (a pass once looped for 25 minutes).
  claude_tools: |
    0.8.5: Claude Code was refused `lt digest` and `lt prep-check` in every run; the app now makes <base>.digest.md
    right before Claude starts and runs `lt prep-check --fix` after it; Claude reads the digest with Read.
prep_runs:
  rule: |
    0.8.5 (owner: compare preparations by time, price and quality): a full preparation (not a refresh) moves the
    previous one's files (brief.md, cards.json, facts.json, prep.json, brief.orig.md, brief.prev.md) out of the live
    folder to <appRoot>/prep-runs/<base>/<time>-before, so the new one starts clean and cannot read it; afterwards
    it copies what it wrote and run.json (route, model, started, duration_s, cost_usd, tokens, turns, sources, ok) to
    <appRoot>/prep-runs/<base>/<time>-<route>-<model>. The previous brief comes back as <base>.brief.prev.md
    (Restore previous version); a failed run puts the old files back.
  compare: tools/prep_compare.py <appRoot>/prep-runs/<base> prints one table (time, price, tokens, brief size,
    sections, speech points with full text, cards, facts) for a quality review
