# Optional components (Pacenote 0.8.6, block E): one pattern for the local model, the link downloader and later
# add-ons. Optional components never count against readiness and are never installed during a live call.
schema_version: 1
components:
  ollama:
    title: Ollama
    human: Ollama, runs the local model (200 MB)      # 0.8.7 (L3.4): the name people read; tech in small grey
    tech: ""
    size: about 200 MB
    for: the model on this Mac (plan B for the preparation and the after-call work)
    where: Settings > AI, About > Components
    on_demand: >-
      The models are served only by a running Ollama. A job on this Mac starts it by itself (the Ollama app in the
      background, else `ollama serve`) and waits up to 40 s; a model already downloaded counts as installed while
      Ollama is stopped, so Install never downloads it again.
  local_model:
    title: Local model (<LocalLLM.model>)
    human: Local AI model, works without Claude (16 GB)
    tech: <LocalLLM.model>
    size: about 16 GB
    for: preparation and after-call work without Claude
    needs: ollama
    where: Settings > AI, About > Components
  link_downloader:
    title: Link downloader (yt-dlp)
    human: Link downloader for YouTube, Drive and Vimeo (10 MB)
    tech: yt-dlp
    size: about 10 MB
    for: transcribing a link (Google Drive, YouTube, Vimeo)
    install: pip install yt-dlp into the core's private venv; updated with the core
    where: Settings > General > Optional add-ons, About > Components
word_export: >-
  Save as Word needs no add-on: macOS writes .docx (NSAttributedString officeOpenXML). If that is ever not enough, a
  library becomes a fourth optional component and Save as Word is disabled until it is installed.
names: >-
  0.8.7 (L3.4): rows show the human name with the size first and the technical name small and grey under it (the
  add-ons step of the onboarding, Settings, About > Components).
states:
  installed: green, with the version
  missing: grey "Not installed, optional" with Install (secondary button)
  installing: progress and Cancel
  failed: one line with Retry
about: >-
  The same rows at the end of About > Components, marked "(optional)". They are never red or orange and never change
  the overall readiness. "Install or repair" installs only the required components, never the optional ones.
onboarding: >-
  0.16.0 (D3): step 5 "What to install" (required parts ticked and locked, optional ones unticked, "Install N and
  continue" or "Continue without extras"). Before 0.16: an optional "Optional add-ons" step after the main setup: one row per component with a checkbox and its size,
  nothing ticked by default, "Install selected" and "Skip". The 16 GB model shows a size warning with the free disk
  space.
dependants: >-
  A control that needs a missing component is disabled, with a small "Install" link next to it that installs at once:
  the Link field of Transcribe a recording without the link downloader; "On this Mac" in the AI route pickers without
  Ollama and the model.
during_a_call: Install and Remove never start during a live call; the button says "After the call".
# 0.16.0 (D3, Bohdan 15.11, v2): Settings > Components and the onboarding's "What to install".
rows_v2: >-
  Three optional rows: Local AI model (the model in Ollama; Ollama is not a row of its own: Install opens its
  download page when it is missing, then downloads the model), Call agent (offered only with Claude, with what it
  does and what it costs), Link downloader. The required parts show in three groups: Speech recognition (recorder,
  whisper), Local search model (localai), Recorder and tips engine (python, core, venv, tips, voices).
remove: >-
  Only optional parts. "Remove..." asks first with the size, what changes and "Remove and free <size>". The model
  goes through Ollama (DELETE /api/delete, the same as `ollama rm`) and the Ollama app stays; the agent and the
  link downloader through `setup.sh remove agent|linkdl` (pip uninstall in the private venv). Required parts are
  never removed (setup.sh exits 3). After the model goes, jobs set to "On this Mac" move to the next connected AI
  in the chain and the chain's local step is switched off (LiveTipsCore ComponentCatalog.afterRemovingLocal).
sizes: >-
  Measured, never written from a table: `setup.sh size <step>` prints "SIZE <bytes>" (du), the model from its
  Ollama manifest. Freed = size before minus size after. The numbers in this file are only what is shown before
  the first measurement (ComponentCatalog.estimate).
about_v2: About keeps the app's signature and "Manage components"; the list of parts left it.
