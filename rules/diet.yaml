# Tip diet: rate and length limits. Enforced in code by the app and stated in the skill.
schema_version: 1
active_rate_seconds: 45        # min gap between non-red tips that do not answer the live topic
rate_seconds: 90               # same when active_mode is off
red_repeat_window_s: 60       # the same red tip (same gist or topic) is not shown again within N s
pm_speaking_window_s: 5        # no non-red tip while the PM has a line in the last N seconds
live_topic_window_s: 60        # a tip topic must match the talk of the last N seconds
one_tip_per_topic: true
topic_similarity_min: 0.5      # token Jaccard at or above this = same topic
stale_after_s: 20              # automatic tips older than N s are suppressed before streaming and final output; historical lines remain context
proactive_default: off
# 2026-11-05 (owner): tips read like telegrams and needed re-reading. The gist is now a plain sentence about what is
# happening, a new "why" line gives the context to build an answer, the phrase may be 2-3 natural sentences.
limits:
  gist_words_max: 14
  why_sentences_max: 2
  why_words_max: 35
  phrase_sentences_max: 3
  phrase_words_max_en: 40
  fact_lines_max: 3
  fact_words_max: 16
  line_chars_max: 70
  lines_max: 9
answer_in_primary:              # 0.9.2 (audit 04.11): a statement the prepared material answers
  per_10_min: 2                 # at most this many such tips in 10 minutes
  once_per_topic: true          # never twice on the same topic (topic_similarity_min)
long_kinds: [speech, agenda, sos, catch_up, your_turn]   # may exceed the length limits
forbidden:
  - long_dash                 # never the em dash
  - abbreviations_in_tips
  - ticket_keys_in_tips
  - russian

# Reliability: automatic live hints only. Manual asks and HELP NOW remain available.
# Re-read transcript lines with identical time, channel and text do not trigger twice.
# Backchannels alone do not trigger a situation-model update; they remain in context.
# A non-red tip whose gist shares 60% of its content words with a gist shown in the last 5 minutes is dropped
# (review of the calls of 2026-11-02/03: 11 of 31 tips of a discovery interview were the same gist again).
# Late red warnings: up to 2 x stale_after_s after their speech, marked late; other late tips are dropped.
# An old line still counts for the agenda, the situation and the brief reload; it only starts no automatic tip.
# In the UI, noncritical automatic tips with the exact same topic and trigger within 90 s
# share one card. Pinned/edited cards and red warnings are never merged.
