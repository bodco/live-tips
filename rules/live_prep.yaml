# Preparation during a call (Pacenote 0.9.0, owner 2026-11-03). Shared by the app and the skill: the PM can make or
# remake the brief while the call runs, from what was said so far plus the usual preparation sources.
schema_version: 1
when: >-
  Only on the PM's click or words: "Prepare now" when the call has no brief, "Prepare again" when it has one
  (the app's brief strip under the tips window header; in the skill "підготуй зараз", "перепідготуй бриф",
  "prepare now", "prepare again"). Never by itself, never on a schedule.
sources: >-
  The sources of a normal preparation for this call (project folder, the local Notion mirror, the last 3 calls of
  this meeting, the files the PM added) plus the transcript of this call up to this minute, read as a source like the
  others: what was asked, agreed and left open so far changes the brief, the agenda and the cards.
route: >-
  The way set for the Preparation job (Settings > AI: Claude Code, Claude API, ChatGPT account, OpenAI API or the
  local model), with the same automatic switch rules as a preparation before the call (rules/ai.yaml).
never_blocks: >-
  The preparation runs as its own process in the background. Recording, speech recognition and the tips loop never
  wait for it and never slow down; responses started on an older context revision are discarded, including streamed
  previews. Speech older than stale_after_s still counts for the agenda, the situation and the brief reload; it only
  starts no automatic tip (rules/diet.yaml).
swap: >-
  When it is ready the new brief, cards and facts replace the call's files in one rename each (<stem>.brief.md,
  .cards.json, .facts.json), the brief in use before is kept as <stem>.brief.prev.md (one previous version is
  enough), and the tips engine reloads them at once ("refresh context" in the inbox). A failed or cancelled run
  leaves the current brief untouched.
strip:
  ready: "Brief · made {time}{, before the call} · Prepare again · Uses what was said so far, plus the project files"
  none: "No brief · tips use only the call so far · Prepare now"
  running: "Preparing in the background… · progress · Cancel · Recording and tips keep going. The new brief takes over when it is ready, about 1 min."
skill: >-
  The skill does the same: on the PM's words it runs the preparation of references/sweep.md in a subagent with the
  transcript so far as one more source, writes the new files next to the call as <stem>.brief.new.md (and
  .cards.new.json, .facts.new.json), then renames them over the current ones after copying <stem>.brief.md to
  <stem>.brief.prev.md; the loop keeps running and reads the new brief on its next turn.

correction: >-
  Correct context in the live window uses /context followed by the current participant, goal or source document
  (at most 2000 characters). The correction reaches the engine at once, whether or not a new preparation can
  start: it goes into the cached brief block of every later request (once, not per request), responses started
  before it are discarded and unpinned automatic tips are hidden; answers, the speech card and the brief stay.
  The old agenda is put aside while the new preparation runs: the new prep replaces it, and when the prep cannot
  start, fails or is cancelled the old agenda comes back with its states (context_restore_agenda).
identity: >-
  Before choosing a checklist, reconcile the current invitation, roles, goal and source document. A repeated
  title is not proof of the same interviewee. Put unresolved contradictions in Needs confirmation before the
  checklist. Never silently reuse the earlier interviewee's questions. Live essentials contains the goal,
  participant/role, primary source, 3-5 key facts/red lines and open confirmations, under 180 words.
