# Call concept: audience, type, live mode. Shared by skill and app.
schema_version: 1
audience:
  values: [auto, team, client, boss]
  boss: internal project where the PM's manager acts as the client; client rules, default language Ukrainian
  effects: [language_default, restricted_marker_strictness, culture_lens]
call_type:
  values: [auto, presentation, interview, coach, transcript]
  transcript: {tips: off, preparation: not needed, after_call: summary, meeting page and follow-up as usual}   # 0.8.5 (owner)
  presentation: {requires: outline.json or slides.json, rules: rules/presentation.yaml}
  interview: {roles: [interviewer, observer]}
  coach:
    # Coach mode: someone is supported while another person (or the PM) speaks.
    roles:
      mentor: a mentor watches a mentee's call; tips and the wrap-up analyse the mentee
      self: the PM is the one being interviewed and gets support for their own answers
mode:
  values: [presenting, discussion]
  presenting_enter_share: 0.65     # PM talk share over the last window
  presenting_exit_share: 0.55      # hysteresis
  window_s: 120
timers:
  checkpoints: [two_thirds, five_minutes_left]
tips_language:
  # 0.8.5 (owner): tips, cards and labels in the meeting's main language; the window's switch (setting tips_lang)
  # changes it to the interface language and back when the two differ. The phrase to say follows answer_lang as before.
  default: the call's main language (me_lang)
  switch: setting tips_lang = uk | en, shown only when the interface language differs
tips:
  # 0.8.5 (owner): a Tips switch in Call settings, before Proactive tips, for any call
  setting: tips = on | off (status field "tips")
  off: no automatic tips, cards, facts, question items or speech card; the transcript, speakers, asks the PM types, the summary, the meeting page and the follow-up go on
  default: on; off for call_type transcript; changing the type to or from transcript switches it

