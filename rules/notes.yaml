# Call notes (Pacenote 0.8.5, owner: "summaries that never drop details, so the context is not lost"). Shared by the
# app and the skill: what a later preparation reads instead of an older call's whole transcript.
schema_version: 2
file: <stem>.notes.md next to the transcript (livetips_m0.callnotes)
language: the language the call was held in (the majority of the transcript lines' language tags), not the app's interface language (0.9.1, owner)
when: after every recorded call, whether or not Notion is set up (with the meeting page when it is), on the "After the call" way (model claude-sonnet-5-5,
  or the model on this Mac when that way is On this Mac); a call of the Transcript type too
content: |
  Header (date and time, length, participants with sides), Summary (5-8 lines), Topics (who said what by name,
  numbers, dates, decisions, 1-3 short quotes in the original language), Questions (who asked whom, answered
  fully / partly / not, and what), Decisions, Action items (owner, what, by when), Promises (ours and theirs),
  Concerns and mood, Open after the call, Facts and numbers (every number, date, ticket key, address said).
names: the PM's name aliases and the project config's names and terms are given, so a garbled word is written as the
  real name with what was heard in brackets ("Sentry (heard \"Send Trends\")")
lossless:
  parts: a long transcript is read in parts of about 25,000 characters, then merged by topic without shortening
  coverage: >-
    every number, date, time, ticket key, domain or address and every question of the transcript is looked
    up in the notes; the missing ones go back to the model with their lines once; the notes end with the coverage
    line ("Coverage: numbers 41/42, keys 6/6, questions 14/15")
preparation: |
  The last 3 calls of the meeting: the newest is read in full (its transcript), the older ones from their notes
  when the notes exist (they keep every detail and cost far fewer steps), else from their transcripts. The skill's
  sweep.md 3b and the app's preparation (Claude Code and the local model) follow the same rule.
cost: about $0.19 per 15-minute call with Sonnet; free on this Mac
meeting_notes: |
  0.9.5.2 (owner: "readable meeting notes people will read, grouped by best practice, no important detail lost, not
  overloaded"). One more request after the full notes (callnotes.MEETING_SYS, the full notes and the transcript with
  times) writes the "## Meeting notes" section at the top of the notes, before "## Summary"; written again, it is
  replaced, never added twice. Fixed English headings (the app reads them), the text in the call's language:
  ### TL;DR (2-3 sentences), ### Decisions, ### Action items ("**Owner**: what (due: when)"), ### Open questions,
  ### Topics (4-8, "#### Title [HH:MM:SS]", "Outcome: one line", 2-4 points), ### Unclear (doubtful names or facts,
  never "heard" in the text). Every item starts with its transcript time "[HH:MM:SS]"; on the call page a time opens
  the transcript there. Readers: the app (MeetingNotes.parse, the Summary tab, Copy, Export) and the Notion meeting
  page (wrapup_notion.meeting_blocks, which waits for the notes up to 10 minutes when the app started both).
  Make meeting notes on an older call: `callnotes --meeting` (only this section when the notes exist, about $0.05 to $0.10).
  The preparation still reads the whole notes file.

