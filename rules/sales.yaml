# Sales mode (Pacenote 0.8.7, block H). An option on top of any call type (Regular, Presentation, Interview), never a
# type of its own. Off: nothing of this file is used and nothing changes. Shared by the app and the skill; a new
# method is added here as data, without code.
schema_version: 1
default_method: general
# S1: picker groups (kind of a method); a method without kind is a qualification method.
kinds:
  general: {en: General, uk: Загальне}
  qualification: {en: Qualification, uk: Кваліфікація}
  questioning: {en: Questioning, uk: Питання}
  approach: {en: Approach, uk: Підхід}
methods:
  general:
    name: {en: General sales, uk: Загальний продаж}
    kind: general
    desc:
      en: No formal qualification. Pacenote follows the client's pain, the value for them, objections, and whether there is a next step with a date.
      uk: Без формальної кваліфікації. Pacenote стежить за болем клієнта, цінністю для нього, запереченнями і тим, чи є наступний крок з датою.
    chip: false
    criteria:
      - key: pain
        name: {en: Pain, uk: Біль}
        explain: {en: What hurts the client now and how much it costs them., uk: Що зараз болить клієнту і скільки це йому коштує.}
        ask: {en: ["What happens if nothing changes?"], uk: ["Що буде, якщо нічого не змінювати?"]}
      - key: value
        name: {en: Value, uk: Цінність}
        explain: {en: What the client gets from us in their own words., uk: Що клієнт отримує від нас, його словами.}
        ask: {en: ["What would a good result look like for you?"], uk: ["Який результат був би для вас хорошим?"]}
      - key: objections
        name: {en: Objections, uk: Заперечення}
        explain: {en: Doubts raised and whether they were answered., uk: Сумніви, які прозвучали, і чи на них відповіли.}
        ask: {en: ["What would stop you from going ahead?"], uk: ["Що могло б вас зупинити?"]}
      - key: next_step
        name: {en: Next step, uk: Наступний крок}
        explain: {en: An agreed next step with a date and an owner., uk: Узгоджений наступний крок з датою і відповідальним.}
        ask: {en: ["Shall we put the next call in the calendar now?"], uk: ["Поставимо наступну зустріч у календар зараз?"]}
  bant:
    name: {en: BANT, uk: BANT}
    kind: qualification
    desc:
      en: "Budget, Authority, Need, Timeline: is there money, the person who decides, a real need and a time frame."
      uk: "Budget, Authority, Need, Timeline: чи є гроші, людина, що вирішує, реальна потреба і терміни."
    chip: true
    criteria:
      - key: budget
        name: {en: Budget, uk: Бюджет}
        explain: {en: Money is set aside or can be found, and roughly how much., uk: Гроші виділені або їх можна знайти, і приблизно скільки.}
        ask: {en: ["Is there a budget for this already?"], uk: ["Чи є вже бюджет на це?"]}
      - key: authority
        name: {en: Authority, uk: Повноваження}
        explain: {en: Who decides and who else takes part in the decision., uk: Хто вирішує і хто ще бере участь у рішенні.}
        ask: {en: ["Who else will be part of this decision?"], uk: ["Хто ще братиме участь у рішенні?"]}
      - key: need
        name: {en: Need, uk: Потреба}
        explain: {en: The problem is real and important for them., uk: Проблема реальна і важлива для них.}
        ask: {en: ["Why is this a priority now?"], uk: ["Чому це пріоритет саме зараз?"]}
      - key: timeline
        name: {en: Timeline, uk: Терміни}
        explain: {en: When they want to decide and to start., uk: Коли вони хочуть вирішити і почати.}
        ask: {en: ["When would you like this to be live?"], uk: ["Коли ви хочете це запустити?"]}
  spiced:
    name: {en: SPICED, uk: SPICED}
    kind: qualification
    desc:
      en: "Situation, Pain, Impact, Critical event, Decision: the client's context, what hurts, what it costs, the deadline that forces a decision and how they decide."
      uk: "Situation, Pain, Impact, Critical event, Decision: контекст клієнта, що болить, скільки коштує, подія, що змушує вирішити, і як вони вирішують."
    chip: true
    criteria:
      - key: situation
        name: {en: Situation, uk: Ситуація}
        explain: {en: Facts about the client today (team, tools, process)., uk: Факти про клієнта зараз (команда, інструменти, процес).}
        ask: {en: ["How do you handle this today?"], uk: ["Як ви робите це зараз?"]}
      - key: pain
        name: {en: Pain, uk: Біль}
        explain: {en: What does not work and why it matters., uk: Що не працює і чому це важливо.}
        ask: {en: ["What is the hardest part of it?"], uk: ["Що в цьому найважче?"]}
      - key: impact
        name: {en: Impact, uk: Вплив}
        explain: {en: The cost of the pain or the gain of solving it, ideally in numbers., uk: Ціна болю або виграш від рішення, краще в цифрах.}
        ask: {en: ["What would solving it be worth to you?"], uk: ["Скільки для вас вартує вирішити це?"]}
      - key: critical_event
        name: {en: Critical event, uk: Критична подія}
        explain: {en: A date or event that forces a decision., uk: Дата або подія, що змушує прийняти рішення.}
        ask: {en: ["Is there a date this has to be done by?"], uk: ["Чи є дата, до якої це треба зробити?"]}
      - key: decision
        name: {en: Decision, uk: Рішення}
        explain: {en: Who decides, how, and on what criteria., uk: Хто вирішує, як і за якими критеріями.}
        ask: {en: ["How do you usually make decisions like this?"], uk: ["Як ви зазвичай ухвалюєте такі рішення?"]}
  meddic:
    name: {en: MEDDIC, uk: MEDDIC}
    kind: qualification
    desc:
      en: "Metrics, Economic buyer, Decision criteria, Decision process, Identify pain, Champion: for larger deals with several people involved."
      uk: "Metrics, Economic buyer, Decision criteria, Decision process, Identify pain, Champion: для більших угод, де бере участь кілька людей."
    chip: true
    criteria:
      - key: metrics
        name: {en: Metrics, uk: Метрики}
        explain: {en: The measurable result the client expects., uk: Вимірюваний результат, якого чекає клієнт.}
        ask: {en: ["How will you measure success?"], uk: ["Як ви виміряєте успіх?"]}
      - key: economic_buyer
        name: {en: Economic buyer, uk: Той, хто платить}
        explain: {en: The person who controls the budget and gives the final yes., uk: Людина, що керує бюджетом і дає остаточне так.}
        ask: {en: ["Who signs off on the budget?"], uk: ["Хто погоджує бюджет?"]}
      - key: decision_criteria
        name: {en: Decision criteria, uk: Критерії рішення}
        explain: {en: What they will compare vendors on., uk: За чим вони порівнюватимуть постачальників.}
        ask: {en: ["What matters most when you choose?"], uk: ["Що найважливіше при виборі?"]}
      - key: decision_process
        name: {en: Decision process, uk: Процес рішення}
        explain: {en: The steps, people and dates from here to a signature., uk: Кроки, люди і дати від сьогодні до підпису.}
        ask: {en: ["What are the steps from here to a signed contract?"], uk: ["Які кроки звідси до підписаного договору?"]}
      - key: identify_pain
        name: {en: Identify pain, uk: Біль}
        explain: {en: The business pain behind the project., uk: Бізнес-біль за проєктом.}
        ask: {en: ["What made you look for a solution now?"], uk: ["Що змусило шукати рішення зараз?"]}
      - key: champion
        name: {en: Champion, uk: Чемпіон}
        explain: {en: Someone inside who wants this to happen and will push for it., uk: Людина всередині, яка хоче цього і проштовхуватиме.}
        ask: {en: ["Who on your side would benefit most from this?"], uk: ["Кому з вашого боку це найбільше допоможе?"]}
  # S1 (2026-11-17): more methods. kind: qualification (what the client must have told), questioning (a sequence of
  # questions, the criteria are its steps in order), approach (how the seller leads the talk). judge: client (only
  # the client's words count, the default) or seller (approach: done when the seller clearly did it and the client
  # reacted). Method names belong to their authors; the descriptions here are our own.
  meddpicc:
    name: {en: MEDDPICC, uk: MEDDPICC}
    kind: qualification
    desc:
      en: "MEDDIC plus Paper process and Competition: for complex deals with procurement, legal review and rival vendors."
      uk: "MEDDIC плюс Paper process і Competition: для складних угод із закупівлями, юристами і конкурентами."
    chip: true
    criteria:
      - key: metrics
        name: {en: Metrics, uk: Метрики}
        explain: {en: The measurable result the client expects., uk: Вимірюваний результат, якого чекає клієнт.}
        ask: {en: ["How will you measure success?"], uk: ["Як ви виміряєте успіх?"]}
      - key: economic_buyer
        name: {en: Economic buyer, uk: Той, хто платить}
        explain: {en: The person who controls the budget and gives the final yes., uk: Людина, що керує бюджетом і дає остаточне так.}
        ask: {en: ["Who signs off on the budget?"], uk: ["Хто погоджує бюджет?"]}
      - key: decision_criteria
        name: {en: Decision criteria, uk: Критерії рішення}
        explain: {en: What they will compare vendors on., uk: За чим вони порівнюватимуть постачальників.}
        ask: {en: ["What matters most when you choose?"], uk: ["Що найважливіше при виборі?"]}
      - key: decision_process
        name: {en: Decision process, uk: Процес рішення}
        explain: {en: The steps, people and dates from here to a decision., uk: Кроки, люди і дати від сьогодні до рішення.}
        ask: {en: ["What are the steps from here to a decision?"], uk: ["Які кроки звідси до рішення?"]}
      - key: paper_process
        name: {en: Paper process, uk: Оформлення}
        explain: {en: "How the contract gets signed: procurement, legal, security review, who signs and how long it takes.", uk: "Як підписується договір: закупівлі, юристи, перевірка безпеки, хто підписує і скільки це триває."}
        ask: {en: ["Once you say yes, what does the paperwork look like on your side?"], uk: ["Коли ви скажете так, як виглядає оформлення з вашого боку?"]}
      - key: identify_pain
        name: {en: Identify pain, uk: Біль}
        explain: {en: The business pain behind the project., uk: Бізнес-біль за проєктом.}
        ask: {en: ["What made you look for a solution now?"], uk: ["Що змусило шукати рішення зараз?"]}
      - key: champion
        name: {en: Champion, uk: Чемпіон}
        explain: {en: Someone inside who wants this to happen and will push for it., uk: Людина всередині, яка хоче цього і проштовхуватиме.}
        ask: {en: ["Who on your side would benefit most from this?"], uk: ["Кому з вашого боку це найбільше допоможе?"]}
      - key: competition
        name: {en: Competition, uk: Конкуренти}
        explain: {en: "Who else they consider, including building it themselves or doing nothing.", uk: "Кого ще вони розглядають, включно з тим, щоб зробити самим або нічого не робити."}
        ask: {en: ["What other options are you looking at?"], uk: ["Які ще варіанти ви розглядаєте?"]}
  gpctba:
    name: {en: GPCTBA/C&I, uk: GPCTBA/C&I}
    kind: qualification
    desc:
      en: "Goals, Plans, Challenges, Timeline, Budget, Authority, Negative consequences, Positive implications: starts from the client's goals rather than from money."
      uk: "Goals, Plans, Challenges, Timeline, Budget, Authority, Negative consequences, Positive implications: починає з цілей клієнта, а не з грошей."
    chip: true
    criteria:
      - key: goals
        name: {en: Goals, uk: Цілі}
        explain: {en: "The client's goals, ideally with a number.", uk: "Цілі клієнта, краще з цифрою."}
        ask: {en: ["What are you trying to reach this year?"], uk: ["Чого ви хочете досягти цього року?"]}
      - key: plans
        name: {en: Plans, uk: Плани}
        explain: {en: How they plan to reach the goals now., uk: Як вони зараз планують досягти цілей.}
        ask: {en: ["How are you planning to get there?"], uk: ["Як ви плануєте цього досягти?"]}
      - key: challenges
        name: {en: Challenges, uk: Перешкоди}
        explain: {en: What stands in the way of the plan., uk: Що заважає плану.}
        ask: {en: ["What could get in the way?"], uk: ["Що може завадити?"]}
      - key: timeline
        name: {en: Timeline, uk: Терміни}
        explain: {en: When they want results., uk: Коли вони хочуть результату.}
        ask: {en: ["By when do you need this working?"], uk: ["До коли це має запрацювати?"]}
      - key: budget
        name: {en: Budget, uk: Бюджет}
        explain: {en: Money set aside or how it would be found., uk: Виділені гроші або як їх знайдуть.}
        ask: {en: ["How do you usually fund projects like this?"], uk: ["Як ви зазвичай фінансуєте такі проєкти?"]}
      - key: authority
        name: {en: Authority, uk: Повноваження}
        explain: {en: Who decides and who else is involved., uk: Хто вирішує і хто ще бере участь.}
        ask: {en: ["Who else needs to be part of this?"], uk: ["Хто ще має бути долучений?"]}
      - key: negative_consequences
        name: {en: Negative consequences, uk: Наслідки бездіяльності}
        explain: {en: What happens if they miss the goal., uk: Що буде, якщо ціль не досягнуть.}
        ask: {en: ["What happens if you do not reach it?"], uk: ["Що буде, якщо не досягнете?"]}
      - key: positive_implications
        name: {en: Positive implications, uk: Виграш}
        explain: {en: What reaching the goal gives them and the people involved., uk: Що дасть досягнення цілі їм і людям, яких це стосується.}
        ask: {en: ["What would reaching it mean for you?"], uk: ["Що означатиме для вас досягти цього?"]}
  spin:
    name: {en: SPIN, uk: SPIN}
    kind: questioning
    desc:
      en: "Situation, Problem, Implication, Need-payoff: a sequence of questions that lets the client say the value in their own words."
      uk: "Situation, Problem, Implication, Need-payoff: послідовність питань, після якої клієнт сам формулює цінність."
    chip: true
    criteria:
      - key: situation
        name: {en: Situation, uk: Ситуація}
        explain: {en: Facts about how they work today. Few questions here, the client gets tired of them., uk: Факти про те, як вони працюють зараз. Таких питань небагато, вони втомлюють клієнта.}
        ask: {en: ["How does this work on your side today?"], uk: ["Як це влаштовано у вас зараз?"]}
      - key: problem
        name: {en: Problem, uk: Проблема}
        explain: {en: A difficulty or dissatisfaction the client admits., uk: Труднощі або незадоволення, які визнає клієнт.}
        ask: {en: ["Where does it fall short?"], uk: ["Де це не працює як слід?"]}
      - key: implication
        name: {en: Implication, uk: Наслідки}
        explain: {en: "What the problem leads to: cost, delays, risk, other teams affected.", uk: "До чого веде проблема: гроші, затримки, ризик, інші команди."}
        ask: {en: ["What does that lead to further down the line?"], uk: ["До чого це призводить далі?"]}
      - key: need_payoff
        name: {en: Need-payoff, uk: Цінність рішення}
        explain: {en: The client says in their own words what solving it would give them., uk: Клієнт своїми словами каже, що дасть рішення.}
        ask: {en: ["If that were solved, what would it change for you?"], uk: ["Якби це було вирішено, що б це змінило для вас?"]}
  sandler:
    name: {en: Sandler pain funnel, uk: Воронка болю Sandler}
    kind: questioning
    desc:
      en: "Goes from the surface problem down to its cost and what it means to the person, then checks they want to fix it now."
      uk: "Веде від поверхневої проблеми до її ціни і того, що вона означає для людини, потім перевіряє, чи хочуть вирішити зараз."
    chip: true
    criteria:
      - key: surface_problem
        name: {en: Surface problem, uk: Проблема}
        explain: {en: The problem as the client first names it., uk: Проблема, як клієнт її спершу називає.}
        ask: {en: ["Tell me more about that."], uk: ["Розкажіть про це більше."]}
      - key: specifics
        name: {en: Specifics, uk: Конкретика}
        explain: {en: A concrete example of the problem., uk: Конкретний приклад проблеми.}
        ask: {en: ["Can you give me an example?"], uk: ["Можете навести приклад?"]}
      - key: history
        name: {en: History, uk: Історія}
        explain: {en: How long it has been a problem and what they already tried., uk: Як довго це проблема і що вже пробували.}
        ask: {en: ["How long has it been like this, and what have you tried?"], uk: ["Як довго так триває і що ви вже пробували?"]}
      - key: cost
        name: {en: Cost, uk: Ціна}
        explain: {en: "What the problem costs them: money, time, people.", uk: "Скільки коштує проблема: гроші, час, люди."}
        ask: {en: ["What has it cost you so far?"], uk: ["Скільки це вам уже коштувало?"]}
      - key: personal_impact
        name: {en: Personal impact, uk: Для людини}
        explain: {en: What it means for the person you talk to., uk: Що це означає для людини, з якою ви говорите.}
        ask: {en: ["How does it affect you personally?"], uk: ["Як це впливає особисто на вас?"]}
      - key: commitment
        name: {en: Commitment, uk: Готовність}
        explain: {en: They want to fix it now rather than live with it., uk: Вони хочуть вирішити це зараз, а не жити з цим.}
        ask: {en: ["Is this something you want to fix now, or can it wait?"], uk: ["Ви хочете вирішити це зараз чи це може почекати?"]}
  challenger:
    name: {en: Challenger, uk: Challenger}
    kind: approach
    judge: seller
    desc:
      en: "Teach, Tailor, Take control: the seller brings an insight that changes how the client sees the problem, fits it to this person and leads to a decision."
      uk: "Teach, Tailor, Take control: продавець приносить інсайт, що змінює погляд клієнта на проблему, підлаштовує його під цю людину і веде до рішення."
    chip: true
    criteria:
      - key: teach
        name: {en: Teach, uk: Інсайт}
        explain: {en: "The seller shared an insight the client did not have, and the client reacted to it.", uk: "Продавець поділився інсайтом, якого клієнт не мав, і клієнт на нього відреагував."}
        ask: {en: ["What we see in companies like yours is that the real cost is somewhere else. Can I show you?"], uk: ["У схожих компаніях ми бачимо, що справжні витрати в іншому місці. Можна покажу?"]}
      - key: tailor
        name: {en: Tailor, uk: Під людину}
        explain: {en: "The message was tied to this person's role, goals or metrics.", uk: "Меседж прив'язано до ролі, цілей або метрик цієї людини."}
        ask: {en: ["For your team specifically, that would mean what?"], uk: ["Для вашої команди конкретно це означало б що?"]}
      - key: take_control
        name: {en: Take control, uk: Веде розмову}
        explain: {en: "The seller led to a concrete step and talked openly about money and dates.", uk: "Продавець привів до конкретного кроку і відкрито говорив про гроші й терміни."}
        ask: {en: ["Let's agree on the next step and the date now."], uk: ["Давайте зараз домовимося про наступний крок і дату."]}
states: [unknown, partial, known]
call_picture:
  key: '"deal": [{"criterion": "<criterion key>", "state": "unknown|partial|known", "what": "<what is known, max 14 words, call language>", "quote": "<the line, max 20 words>", "t": "<HH:MM:SS>"}], "objections": [{"what": "<the doubt, max 12 words>", "answer": "<how it was answered, or empty>", "t": "<HH:MM:SS>"}], "next_step": {"what": "<agreed next step or empty>", "due": "<date or empty>", "owner": "<name or me>"}, "signals": [{"what": "<buying signal, max 12 words>", "t": "<HH:MM:SS>"}], "competitors": [{"name": "<competitor or alternative named>", "what": "<what was said about it, max 12 words>", "t": "<HH:MM:SS>"}], "price_talk": [{"who": "us|them", "what": "<price, discount or terms said, max 14 words>", "t": "<HH:MM:SS>"}], "stakeholders": [{"name": "<person>", "role": "decider|champion|blocker|influencer|user|unknown", "stance": "for|neutral|against|unknown", "quote": "<the line, max 16 words>", "t": "<HH:MM:SS>"}], "mutual_plan": [{"step": "<agreed step, max 12 words>", "owner": "us|them|<name>", "due": "<date or empty>"}]'
  key_limits: '"limit_breach": [{"what": "<what our side offered, max 14 words>", "limit": "<the PRICE LIMIT it breaks>", "t": "<HH:MM:SS>"}]'
  rule: >-
    deal = the qualification CRITERIA (given with their keys) as heard on this call and before it: known when the client
    said it clearly, partial when only part of it, unknown otherwise; keep the strongest state reached and the line it
    came from. Only the client's words count, never the PM's guesses. objections = doubts of the client and how the PM
    answered. next_step = only a step agreed by both sides; due when a date was said. signals = clear buying signals
    (asking about price, start date, contract, onboarding).
    S1: competitors = competitors or alternatives the client named (including "build it ourselves"). price_talk =
    prices, discounts and payment terms said by either side (who: us or them). stakeholders = people who take part in
    the decision, named on this call or before it: role only when the call shows it (decider signs or approves money,
    champion pushes for us inside, blocker pushes against, influencer is asked for an opinion, user will use it),
    stance from their own words. mutual_plan = steps both sides agreed on the way to a decision (pilot, security
    review, legal, sign-off), each with an owner and a date when said. Empty lists are left out.
  rule_limits: >-
    limit_breach = our side (the PM or a colleague) offered a price, a discount or terms that break one of the PRICE
    LIMITS below. Only a clear offer counts, never a question or the client's ask.
  judge_seller: >-
    This method is an APPROACH (judge = seller): its criteria are what the SELLER does, not what the client tells.
    known when the seller clearly did it and the client reacted (agreed, asked about it, pushed back on it), partial
    when the seller did it and there was no reaction, unknown otherwise. Never a rating of the seller.
tips:
  objection: the doubt in one line and 1-2 sentences of answer; from an answer card when one matches
  qualify:
    when: a criterion is still unknown after 40% of the planned length or 10 minutes before the end, whichever comes first
    say: what is not clear yet and one question (from the criterion's ask)
  pain: the client named a pain without its size or consequence; ask about the scale or what happens if nothing changes
  next_step:
    when: 5 minutes before the end and next_step is empty or has no date
    say: propose a concrete next step with a date
  competitor: a competitor was named; the answer card about it when there is one
  signal: a buying signal; how to lock it in (the step to propose now)
  price_limit: >-
    red: our side offered more than a price limit allows (a card with Type price and a Limit line); the limit and a
    phrase to walk it back without losing face
  stakeholder:
    when: after 40% of the planned length nobody is known as the decider; or a blocker (role blocker or stance against) spoke
    say: who decides is not known yet and a question to find out; for a blocker, a question about what they need to see
# S1: generic deal stages. A CRM stage (from <stem>.crm.md, "- Stage:" line) is matched by its words; the first stage
# whose word is in the stage name wins. focus = the criteria asked first and the blocks shown first. No match: no
# focus, nothing changes.
stages:
  discovery:
    name: {en: Discovery, uk: Знайомство}
    words: [appointment, discovery, lead, intro, new, contact, знайомство, лід]
    focus: [situation, pain, problem, surface_problem, identify_pain, goals, need, metrics]
  qualification:
    name: {en: Qualification, uk: Кваліфікація}
    words: [qualif, qualified, кваліфік]
    focus: [authority, economic_buyer, budget, timeline, decision, decision_process, champion]
  proposal:
    name: {en: Proposal, uk: Пропозиція}
    words: [presentation, proposal, demo, quote, пропоз, демо, презент]
    focus: [decision_criteria, impact, value, competition, implication, need_payoff, competitors]
  negotiation:
    name: {en: Negotiation, uk: Переговори}
    words: [decision, negotiat, bought, contract, переговор, контракт, рішення]
    focus: [paper_process, decision_process, economic_buyer, price_talk, stakeholders]
  closing:
    name: {en: Closing, uk: Закриття}
    words: [closing, close, commit, sign, verbal, закрит, підпис]
    focus: [next_step, paper_process, mutual_plan]
priority: >-
  The PM triggers stay. In sales mode a sales tip wins over another tip of the same importance. The overall rate does
  not grow: the same limits apply.
ask_order: answer cards first, then the brief and the project memory
coach: >-
  With Coach mode, tips address the person being observed (the seller): when the PM watches someone else sell
  (interview role observer, or a coach call with role mentor) every sales tip starts with "Seller:" / "Продавцю:" and
  its phrase is what the seller can say; when the PM is the one supported (role coach, "I am interviewed") the PM is
  the seller and tips stay as they are.
coach_prefix: {en: "Seller: ", uk: "Продавцю: "}
prep:
  sections:
    company: >-
      Company: what they do, size, news of the last 90 days, with links. Web search only in a sales preparation and
      only the company name or domain goes to the search, never the content of the project's files. Under it the line
      "Searched the web for: <name or domain>. Nothing from your files was sent." Settings > AI switch "Research the
      company on the web before sales calls", on by default.
    from_crm: "From CRM: the snapshot <stem>.crm.md (rules/crm.yaml > snapshot) with its age."
    where_we_are: "Where we are: the qualification from earlier calls of the series and the CRM: known, unknown, who said what; S1: the stakeholders (role, stance) and the open steps of the mutual action plan from the earlier calls of the series (<stem>.sales.json)."
    objections: "Likely objections: 3-5 with short answers, from the answer cards and past calls."
    questions: "Questions to ask: the questions that close the gaps."
    goal: "Goal of this call: one desired next step."
after_call:
  section: >-
    The call page and the Notion meeting page get a Sales section: the criteria (state, what is known, quote), the
    objections and how they were answered, the next step with its date, and a suggested deal stage (a suggestion only).
  scorecard: >-
    For the PM only: criteria known, the PM's share of talk, open questions, whether there is a next step with a date.
    Facts of the call only, never a rating of people. Kept with the call (<stem>.sales.json); Statistics can filter
    sales calls.
  followup: a recap of the pain, the value, what was agreed, the next step and the mutual action plan (owners, dates)
  blocks: >-
    S1: the call page, the Notion Sales section and <stem>.sales.json also hold the stakeholders (role, stance), the
    mutual action plan, the competitors named, the prices said, any limit breach and the CRM stage. Empty: left out.
answer_cards:
  file: "<project or workspace root>/pacenote/answer-cards.md"
  format: '"## <question or topic>" then the answer; optional lines "Tags: a, b" and "Use when: ..."'
  # S1: one file for answers, battlecards and price limits. "Tags: competitor" without Type still means competitor.
  types: [answer, competitor, price]
  fields:
    type: '"Type: answer|competitor|price"'
    they_win: '"They win: <where the competitor is stronger>" (competitor)'
    we_win: '"We win: <where we are stronger>" (competitor)'
    trap: '"Trap: <a question that shows our strength>" (competitor)'
    limit: '"Limit: <the line our side never crosses, e.g. no more than 20% discount>" (price)'
  index: indexed by the project's local index (.livetips-index/, a new document source, same format)
