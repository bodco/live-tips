# Local semantic layer (embeddings). Shared by live-transcriber (skill) and LiveTips.app.
# Values mirror live-transcriber v38 defaults; they are estimates until calibrated in M0
# (spikes/m0/livetips_m0/semantic_eval.py on recorded calls).
schema_version: 1
model: bge-m3                 # multilingual (uk, en, es), 1024 dimensions
engine_default: ollama        # ollama | embedded (decided in M0)
ollama_url: http://127.0.0.1:11434
timeout_s: 2.0                # per live embedding call; a line that misses it is skipped
min_words: 3                  # shorter lines are not embedded
queue: 6                      # lines waiting; when behind, the oldest is dropped
topic_window_s: 60            # rolling live-topic vector
thresholds:
  fact_min: 0.55              # cosine of an other-side line to a fact for an automatic 📌
  card_min: 0.60              # cosine of a line to a card (gist or trigger)
  fact_margin: 0.10           # must beat the entry's small-talk noise floor by this much (0.08 -> 0.10 after M0 labelling, 2026-10-21)
  card_margin: 0.10
  sos_min: 0.45               # SOS picks by the live topic
  index_min: 0.40             # SOS and search: project index snippets
fact_gate: question_or_topic_held   # a fact shows on an other-side line that is a question, or the topic held 2+ lines
# 0.9.2 (audit 04.11: their argument ran 30-90 s over ~9 s ASR lines, 38 facts blocked as "not a question"). Every fact
# (owner: primary is not only the attached file; the project context, recent calls and threads count too):
fact_window:
  text: their lines of the last topic_window_s joined (2+ lines), one extra embedding per other-side line
  held: two windows in a row at window_min and window_margin above the floor, or one at window_strong, or one line at line_strong (0.9.6)
  window_min: 0.60
  window_margin: 0.12
  window_strong: 0.18
  line_strong: 0.18           # 0.9.6: one of their lines at fact_min and this far above the floor holds the topic at once
  another_topic: a two-line match is dropped when the window's cosine to the fact is under fact_min
  said_by_pm: not shown when a PM line of the window reached fact_min - 0.05 to the fact (questions still get it)
  once_per_call: by the topic a fact shows once per call; a question still gets it after the cooldown
  one_a_minute: by the topic at most one fact per topic_window_s (they do not stack); questions are not limited
# 0.9.2 (audit of a 04.11 call). Cards by meaning:
card_text: gist_plus_plain_triggers_and_words   # a card whose triggers are all regexes is not matched by meaning, unless "semantic": true
card_by_meaning: once_per_call      # a card shown once (by meaning or by a trigger) comes again only by its trigger
address_cards: held                 # a "your turn" card ("address": true, or a trigger with a name alias) is never shown by the recorder;
                                    # the model answers an update asked by name with what is new (prompt ADDRESS_ANY)
one_word_triggers: ignored          # a plain trigger of one word under 8 letters without a digit never fires; lt prep-check warns,
                                    # --fix moves it to the card's "words" (still matched by meaning)
# Neutral small talk and call logistics; the highest cosine of an entry to these is its noise floor.
neutral_anchors:
  - "Hello, can you hear me?"
  - "Добрий день, мене чути?"
  - "Hola, ¿me escuchan?"
  - "Let me share my screen."
  - "Зараз покажу екран."
  - "Déjame compartir mi pantalla."
  - "Sorry, I was on mute."
  - "Вибачте, у мене був вимкнений мікрофон."
  - "Perdón, estaba en silencio."
  - "Okay, sounds good, thank you."
  - "Так, добре, дякую."
  - "Vale, perfecto, gracias."
  - "The weather is nice today."
  - "Сьогодні гарна погода."
  - "Hoy hace buen tiempo."
  - "See you next week, bye."
  - "До зустрічі, бувайте."
  - "Nos vemos la próxima semana, chao."
  - "One moment, my internet is slow."
  - "Хвилинку, щось інтернет гальмує."
  - "How was your weekend?"
  - "Як пройшли вихідні?"
  - "Let's wait a minute for the others to join."
  - "Почекаємо ще хвилину, поки всі підключаться."
