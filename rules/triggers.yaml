# Live Tips shared rules: triggers.
# Single source for the Cowork skill (the "Triggers" table in SKILL.md is generated from
# `triggers` below by tools/gen_skill_section.py) and for LiveTips.app (local cue detection,
# routing and the model prompt).
#
# route:
#   direct   - a strong local signal sends the event straight to the `tip` role (no classify step)
#   classify - the `classify` role decides first (cheap, fast model)
#   local    - handled by local code, no model
#   state    - logged into call state only, never shown
#
# cues: word lists for local, model-free detection. Lowercase; a cue matches a word that starts
# with it (so inflected forms match). Name aliases of the PM come from the user config, never here.
schema_version: 1
section_title: Triggers (reactive; proactive ones live in `proactive.md`)
triggers:
- id: your_turn
  level: red
  level_label: 🔴
  route: direct
  skill_trigger: '**Your turn**: `{them_label}` addresses the PM by any of `settings.user.name_aliases` (any grammatical form or misspelling) with a request for an update or opinion (never predicted from the order of a round)'
  skill_tip: opening sentence + the speech theses not used yet, in order (format in `speech.md`); one topic asked = that topic only. Immediate
- id: direct_question
  level: red
  level_label: 🔴
  route: direct
  skill_trigger: A direct question to the PM
  skill_tip: gist "🎯 {тема}" + the answer as a ready phrase + up to 2 facts with sources, from the brief, cards, fact book
- id: question_to_others
  level: orange
  level_label: 🟠
  route: local
  skill_trigger: A question to anyone else on the call (or to the room) that the brief, the cards, the fact book or Current State answer
  skill_tip: 'gist "🟠 {тема}" (orange, never 🎯 or 🔴: red is only for the PM) + the fact the PM could give or add, with its source. Who was asked does not matter: the PM may be expected to answer or add. No fact = silence'
- id: new_requirement
  level: red
  level_label: 🔴
  route: direct
  skill_trigger: '`{them_label}` asks for something new ("could you also", "can we add", a change of scope or behaviour)'
  skill_tip: '"Нова вимога. Не погоджуй зараз." + "Good idea. I will write it down. We will check it and come back to you."'
- id: pm_commitment
  level: red
  level_label: 🔴
  route: direct
  skill_trigger: '`{me_label}` commits a date or an estimate'
  skill_tip: '"Оцінку дає виконавець. Не називай цифру." + a phrase that defers'
- id: contradicts_decision
  level: red
  level_label: 🔴
  route: classify
  skill_trigger: A statement contradicts a Decision or a red line of the brief
  skill_tip: '"Суперечить рішенню {дата}" + the decision in a few words'
- id: frustration
  level: red
  level_label: 🔴
  route: classify
  skill_trigger: Frustration, escalation, "disappointed", "again", a threat to the timeline or contract
  skill_tip: '"Клієнт незадоволений: {що}" + a phrase that acknowledges, gives a plan and the date of the next update'
- id: scope_pushback
  level: red
  level_label: 🔴
  route: classify
  skill_trigger: 'The other side pushes back on an estimate, a term, a price or the scope ("too long", "should be faster", "too expensive", "it should be simple", "cut it down"); 2026-11-02, owner: not only in sales calls'
  skill_tip: '"Заперечення: {що}" + a phrase that acknowledges, names what drives the estimate (scope, risk, dependency) and offers the choices (cut the scope, move the date, add people, split into stages), never a number for an estimate; the answer from `pacenote/answer-cards.md` when a card matches ("Use when"), else from the brief and the fact book'
- id: value_doubt
  level: red
  level_label: 🔴
  route: classify
  skill_trigger: 'The other side doubts that a feature or a piece of work is needed or worth its cost ("why do we need this", "what is the value", "who asked for this", "why are we paying for it"), or has forgotten why it is in the plan; 2026-11-02, owner'
  skill_tip: '"Навіщо це: {робота}" + why it is there, from a Decision of the register (its date, context and the alternative that was rejected), the brief or the fact book, then the value in the client''s own terms; for work the client cannot see (technical, security, refactoring, test, monitoring) what it protects and what it costs later if it is skipped (the risk register, past incidents), with the choice left to the client, never a promise of a benefit nobody agreed'
- id: pm_factual_error
  level: red
  level_label: 🔴
  route: classify
  skill_trigger: 'Client or boss call only: the PM states a fact that contradicts the brief, tracker or a Decision (wrong date, price, scope)'
  skill_tip: '"Неточно: {Y}, не {X}" + correction phrase + source (`checks.md`)'
- id: fix_owner_date
  level: orange
  level_label: silent
  route: classify
  skill_trigger: A decision, owner or date was discussed and not fixed
  skill_tip: 'log in the call picture (`decisions`, `on_me`); a tip "Зафіксуй: {що}" only with `proactive.md` on (phrase in the call''s language, never a number for an estimate)'
- id: answer_in_primary
  level: orange
  level_label: 🟠
  route: classify
  skill_trigger: '`{them_label}` states something (a claim, a doubt, a pain, "there is no structure") that the prepared material answers with a ready answer, proof or caveat (the fact book, the cards, the brief, the main document), and nobody on the call has said it yet (0.9.2)'
  skill_tip: 'gist "🟠 {тема}: є відповідь" + the answer as a ready phrase + the fact with its source. Not when the PM or anyone said it in the last lines; at most 2 in 10 minutes and one per topic (diet.yaml > answer_in_primary)'
- id: add_fact
  level: orange
  level_label: silent
  route: classify
  skill_trigger: A topic of the brief is being discussed and the brief, cards or fact book hold a fact the others did not say
  skill_tip: 'a tip "Додай: {тема}" only with `proactive.md` on (2026-10-26: these were noise during other people''s updates)'
- id: side_talk
  level: orange
  level_label: 🟠
  route: local
  skill_trigger: 2+ `{them_label}` lines in a language the PM does not use on this call
  skill_tip: '"Між собою {мовою}" + the gist in 1-2 lines (skip small talk)'
- id: unanswered_question
  level: orange
  level_label: 🟠
  route: local
  skill_trigger: A question to the PM unanswered for ~2 min
  skill_tip: '"Без відповіді: {питання}" + phrase'
- id: timer_checkpoint
  level: orange
  level_label: 🟠
  route: local
  skill_trigger: At 2/3 of the length and 5 min before the end
  skill_tip: the open checklist items and "Decisions to obtain" not obtained yet
- id: silent_log
  level: silent
  level_label: silent
  route: state
  skill_trigger: Action items, new requests, commitments, answers (internal calls)
  skill_tip: log in state, list in the wrap-up
cues:
  question_words:
    uk: [що, як, коли, чому, навіщо, хто, де, куди, чи, скільки, який, яка, яке, які, якого, можеш, можете, зможеш, зможете]
    en: [what, how, when, why, who, where, which, can, could, would, should, will, is, are, do, does, did, have, has]
    es: [qué, cómo, cuándo, por qué, quién, dónde, cuál, cuánto, puedes, puede, podrías, podría]
  second_person:
    uk: [ти, тебе, тобі, тобою, твій, твоя, твоє, твої, ви, вас, вам, вами, ваш, ваша, ваше, ваші, скажи, скажіть, подивись, подивіться]
    en: [you, your, yours]
    es: [tú, tu, usted, ustedes, puedes, puede]
  update_request:
    uk: [апдейт, оновлен, статус, що в тебе, що у тебе, як у тебе, твоя черга, по твоїй, по твоєму]
    en: [update, status, your turn, over to you, what about you, anything from you]
    es: [actualización, estado, tu turno]
  new_requirement:
    uk: [а можна ще, можна додати, треба ще, давайте додамо, а можете, хотілося б, ще одне прохання]
    en: [could you also, can you also, can we add, can you add, we also need, we would like, would it be possible, one more thing]
    es: [podrían también, pueden agregar, necesitamos también, sería posible]
  commitment_units:
    uk: [годин, години, день, дні, днів, тиждень, тижні, тижнів, спринт, спринти, до понеділка, до вівторка, до середи, до четверга, до пʼятниці, до кінця тижня, завтра]
    en: [hours, hour, days, day, week, weeks, sprint, sprints, by monday, by tuesday, by wednesday, by thursday, by friday, end of week, tomorrow]
    es: [horas, días, semana, semanas, sprint, mañana, el lunes, el viernes]
  scope_pushback:
    uk: [занадто довго, надто довго, задовго, так довго, це довго, має бути швидше, мало бути швидше, треба швидше, чому так довго, занадто дорого, надто дорого, задорого, чому так дорого, це дорого, це ж просто, це має бути просто, не вкладаємося, не влізає, скоротити строк, скоротити скоуп, зменшити скоуп]
    en: [too long, that long, should be faster, needs to be faster, why so long, too expensive, too much time, should be simple, should be quick, should not take, cut the scope, reduce the scope, cut it down, no way it takes]
    es: [demasiado tiempo, tan largo, debería ser más rápido, demasiado caro, debería ser simple]
  value_doubt:
    uk: [навіщо це, навіщо нам, нащо це, нащо нам, для чого це, для чого нам, яка від цього користь, яка цінність, чому ми це робимо, не бачу сенсу, не бачу користі, не бачу цінності, не розумію навіщо, це взагалі потрібно, це взагалі треба, чи потрібно це, кому це потрібно, за що ми платимо, чому ми за це платимо, чому це в плані]
    en: [why do we need, why are we doing, what is the point, what's the point, what is the value, what's the benefit, why is this needed, why is this in, do we really need, do not see the value, don't see the value, don't see why, why are we paying, who needs this, who asked for this]
    es: [para qué lo necesitamos, cuál es el valor, no veo el valor, por qué pagamos]
  frustration:
    uk: [знову, незадоволен, розчарован, скільки можна, неприйнятно, затримк]
    en: [again, disappointed, frustrated, unacceptable, not happy, delay, escalate]
    es: [otra vez, decepcionado, inaceptable, retraso]
question_card:                 # instant "❓" card in the window for an other-side line (recorder, both engines)
  # shown when: the line names the PM (name_aliases) and asks; or has a strong work word;
  # or has "?" and a weak time/amount word. A bare "?" (small talk, songs) gets no card.
  strong: [естімейт, оцінк, дедлайн, термін, статус, ціна, вартіст, бюджет, реліз, estimate, eta, deadline, status, price, cost, budget, release, estimación, plazo, precio, presupuesto]
  weak_with_question_mark: [скільки, коли, як довго, how long, how much, how many, when, cuánto, cuándo]
  music_markers: ["♪", "♫", "[музика]", "[music]"]
