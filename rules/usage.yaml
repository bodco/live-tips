# Local feature usage log (Pacenote 0.8.7, block M). Shared by the app (UsageLog, Swift) and the engine (usage.py).
# Purpose: know which features are used and which are not. Local only for now; a server sink comes later behind the
# same interface (UsageSink) without changes at the call sites.
schema_version: 1
file: "<app_root>/usage/YYYY-MM.jsonl"     # one line {"t": ISO 8601, "e": "<event>", "p": {...}}
keep_months: 12                          # older monthly files are deleted
rule: >-
  Never log the words of a call, names of people, projects, clients or files, titles, ids or any free text. Only the
  event name, the time and the parameters listed below: small numbers, booleans and short fixed values. A string
  parameter longer than 80 characters is rejected. No user id and no machine id.
setting:
  key: usageLog            # Settings > General > Privacy, on by default
  text_en: "Only event names and numbers, never the words of a call. Stays on this Mac until you choose to send it."
  text_uk: "Лише назви подій і числа, ніколи слова дзвінка. Лишається на цьому Mac, доки ви самі не вирішите надіслати."
events:
  call_started: [type, sales, has_brief]
  call_ended: [minutes]
  prepare_run: [type, source, seconds]
  prepare_again: []
  presentation_mode_on: []
  slide_sync: [variant]
  rehearsal_started: []
  rehearsal_finished: [score]
  transcribe_run: [source, minutes]
  search_calls: []
  followup_written: []
  followup_copied: []
  followup_open_mail: []
  notion_page_written: []
  notion_task_ticked: []
  risk_added: []
  decision_added: []
  decision_superseded: []
  auto_added: [kind, n]
  series_opened: []
  call_page_edited: [section]
  tip_shown: [kind]
  tip_action: [kind, action]
  help_now: []
  ask_typed: []
  hotkey: [name]
  update_crm: [fields]
  answer_card_saved: []
  feature_try_it: [feature]
  demo_opened: [kind]
  onboarding_step: [step, skipped]
  google_connect: []
  google_links_read: [n]
  google_export: []
  google_meet: [transcript]
  tip_rated: [kind, verdict, reason]       # 0.9.4: check, wave or cross on a card (reason: the first chip or empty)
  speakers_merged: [aliases]               # 0.9.4: Settings > Voice library > Merge, how many names the person has now
  meet_participants: [n, named]            # 0.9.4: Meet participants read after the call, speakers named from them
  telemetry_sent: [lines]                  # 0.9.4: a batch sent to the author (Help improve Pacenote, off by default)
  rec_started: [kind, source]              # 0.9.5: call recording started (kind audio or video; source sound, display or chosen)
  rec_paused: []                           # 0.9.5: call recording paused
  rec_saved: [kind, minutes]               # 0.9.5: a part of a call recording saved in <project>/video/
  rec_uploaded: [minutes, auto]            # 0.9.5: a call recording copied to the PM's Google Drive
telemetry:                               # 0.9.4 (owner): Help improve Pacenote
  setting: shareUsage                    # Settings > General > Privacy, off by default; needs usageLog on
  endpoint: https://pacenote-telemetry.neymet-bogdan.workers.dev/v1/batch   # app/telemetry (Cloudflare Worker + D1)
  when: once a week (checked at launch and every 6 hours), complete days only, never days before it was turned on
  what: the lines of this usage log, each re-checked against events above; the time becomes the day
  header: schema 1, install (a random id made on this Mac when sharing is turned on, kept until it is turned off, to tell users apart; no accounts yet), app_version, rules_version, ui_lang, routes per job
  never: words of a call, comments, names, projects, files, titles, emails, IP address (the server keeps none)
  preview: Show what is sent writes usage/next-batch.json
  server: telemetry/worker.js validates the same rules again and refuses anything else (400); 3 batches a day per install at most
