# Local feature usage log (Pacenote 0.8.7, block M). Shared by the app (UsageLog, Swift) and the engine (usage.py).
# Purpose: know which features are used and which are not. Local only for now; a server sink comes later behind the
# same interface (UsageSink) without changes at the call sites.
schema_version: 1
file: "<app_root>/usage/YYYY-MM.jsonl"     # one line {"t": ISO 8601, "e": "<event>", "p": {...}}
keep_months: 12                          # older monthly files are deleted
rule: >-
  Never log the words of a call, names of people, projects, clients or files, titles, ids or any free text. Only the
  event name, the time and the parameters listed below: small numbers, booleans and short fixed values. A string
  parameter longer than 80 characters is rejected. No user id and no machine id.
setting:
  key: usageLog            # Settings > General > Privacy, on by default
  text_en: "Only event names and numbers, never the words of a call. Stays on this Mac until you choose to send it."
  text_uk: "Лише назви подій і числа, ніколи слова дзвінка. Лишається на цьому Mac, доки ви самі не вирішите надіслати."
events:
  call_started: [type, sales, has_brief]
  call_ended: [minutes]
  prepare_run: [type, source, seconds]
  prepare_again: []
  presentation_mode_on: []
  slide_sync: [variant]
  rehearsal_started: []
  rehearsal_finished: [score]
  transcribe_run: [source, minutes]
  search_calls: []
  followup_written: []
  followup_copied: []
  followup_open_mail: []
  notion_page_written: []
  notion_task_ticked: []
  risk_added: []
  decision_added: []
  decision_superseded: []
  auto_added: [kind, n]
  series_opened: []
  call_page_edited: [section]
  tip_shown: [kind]
  tip_action: [kind, action]
  help_now: []
  ask_typed: []
  hotkey: [name]
  update_crm: [fields]
  answer_card_saved: []
  feature_try_it: [feature]
  demo_opened: [kind]
  onboarding_step: [step, skipped]
  google_connect: []
  google_links_read: [n]
  google_export: []
  google_meet: [transcript]
  tip_rated: [kind, verdict, reason]       # 0.9.4: check, wave or cross on a card (reason: the first chip or empty)
  speakers_merged: [aliases]               # 0.9.4: Settings > Voice library > Merge, how many names the person has now
  meet_participants: [n, named]            # 0.9.4: Meet participants read after the call, speakers named from them
  telemetry_sent: [lines, to]              # 0.9.4: a batch sent to the author (Help improve Pacenote, on by default since 0.10.1); 0.19.0: to server or worker
  entitlements_refresh: [ok, why]          # 0.19.0 (B3): the plan info asked again (why: new, same, signature, network)
  module_locked: [module, state]           # 0.19.0 (B3): a closed module was opened (state: plan, quota, policy)
  plan_request_opened: [from]              # 0.19.0 (B3): Request plan opened the console (from: lock, account)
  plans_opened: [from]                     # 0.19.0: Compare plans opened (from: account, lock, quota, console)
  plan_chosen: [plan, from]                # 0.19.0: an owner or admin switched the plan (plan ids only)
  org_team_started: [plan]                 # 0.19.0: a team organization started from Solo
  console_platform: [google]               # 0.19.0: staff opened Platform in the Console tab (google: asked Google again first)
  rec_started: [kind, source]              # 0.9.5: call recording started (kind audio or video; source sound, display or chosen)
  rec_paused: []                           # 0.9.5: call recording paused
  rec_saved: [kind, minutes]               # 0.9.5: a part of a call recording saved in <project>/video/
  rec_uploaded: [minutes, auto]            # 0.9.5: a call recording copied to the PM's Google Drive
  call_reassign: [when, files]             # 0.10.1: a call moved to another project (when: live or after)
  call_reassign_notion: [kind]             # 0.10.1: its Notion pages followed (kind: meetings or new_page)
  meeting_end: [action]                    # 2026-11-10: the meeting seemed to end (keep, stop or ask)
  google_picker_copy: []                   # a Google file copied through the Picker
  calendar_refresh: [from, new]            # 2026-11-17 (owner): Refresh calendars by hand (from: home or menu_bar; new: calls that appeared)
  # 2026-11-17 (S1 finding, spec 13): logged by the app since 0.15-0.18 but missing here, so never written until now
  addons_chosen: [n, where]                # components picked in onboarding or What's new (where)
  component_removed: [id, freed_mb]        # an optional component removed in Settings > Components
  provider_limit_alert: [provider]         # a provider's monthly spend passed the alert share
  provider_limit_capped: [provider]        # a provider's monthly spend reached its cap
  project_wizard: [org, folder, card, links]# a project added with the wizard
  project_removed: [sample, trash]         # a project removed (sample project; local folder to the Trash)
  transcript_drive: [shared_drive]         # a transcript copied next to the recording in Google Drive
  whatsnew_shown: [from, to]               # What's new opened after an update
  whatsnew_closed: [seen]                  # What's new closed (seen: read to the end)
  practice_call: [from]                    # the practice call started
  sync_pull: [items]                       # calls and items pulled from the server
  org_card_saved: [fields]                 # an organization project card saved (how many fields changed)
  org_register_changed: [kind]             # a decision, task or risk of an organization project changed
  org_register_deleted: [kind]             # a decision, task or risk of an organization project deleted
  org_state_saved: [bytes]                 # the current state of an organization project saved
  org_index_built: [files, skipped, vectors]# the file index of an organization project built
  org_change_restored: [entity]            # an earlier version restored from project history
  org_setup_invites: [n]                   # invites sent from the organization wizard
  org_setup_done: [org_teams]              # the organization wizard finished
telemetry:                               # 0.9.4 (owner): Help improve Pacenote
  setting: shareUsage                    # Settings > General > Privacy, on by default since 0.10.1 (D15), also once for updates
                                         # (said at the next launch); needs usageLog on, a usage log turned off keeps it off
  endpoint: https://pacenote-telemetry.neymet-bogdan.workers.dev/v1/batch   # app/telemetry (Cloudflare Worker + D1)
  when: once a week (checked at launch and every 6 hours), complete days only, never days before it was turned on
  what: the lines of this usage log, each re-checked against events above; the time becomes the day
  header: schema 1, install (a random id made on this Mac when sharing is turned on, kept until it is turned off, to tell users apart; no accounts yet), app_version, rules_version, ui_lang, routes per job
  never: words of a call, comments, names, projects, files, titles, emails, IP address (the server keeps none)
  preview: Show what is sent writes usage/next-batch.json
  server: telemetry/worker.js validates the same rules again and refuses anything else (400); 3 batches a day per install at most
