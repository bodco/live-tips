# What's new (Pacenote 0.16.0, D3). After the first launch of a new version the app shows the items newer than the
# last version this person saw, that apply to them (`when`) and, for a setup step, that they have not done yet.
# A new person does not see the current version's items after the onboarding; the full list is Settings > Help >
# What's new. Read by LiveTipsCore/WhatsNew.swift (a small YAML subset: one `key: value` per line, plain or
# double-quoted values, no multi-line values).
#
# Fields: id, version (items in order, versions never go down), title_en, title_uk, body_en, body_uk (both
# languages always), try (a FeatureRegistry id in LiveTips/Features.swift), setup_step (an onboarding step: the item
# shows while it is not done; "addons" = optional components chosen or installed), when (comma list, all must hold:
# provider:claude, provider:chatgpt, module:tracker, os:15; empty = everyone).
# CoreChecks (whatsNewD3): EN and UK for every item, `try` exists in FeatureRegistry, versions do not go down.
schema_version: 1
items:
  - id: settings_search
    version: 0.15.0
    title_en: "Settings search"
    title_uk: "Пошук у Налаштуваннях"
    body_en: "Press ⌘F in Settings and type \"key\", \"Notion\" or \"language\"."
    body_uk: "Натисніть ⌘F у Налаштуваннях і введіть «ключ», «Notion» або «мова»."
    try: settingsSearch
  - id: components
    version: 0.16.0
    title_en: "Settings › Components"
    title_uk: "Налаштування › Компоненти"
    body_en: "See what Pacenote installed on this Mac, how much space it takes, and remove what you don't use."
    body_uk: "Що Pacenote встановив на цей Мак, скільки місця це займає, і як прибрати те, чим ви не користуєтесь."
    try: components
  - id: addons
    version: 0.16.0
    title_en: "Choose optional add-ons"
    title_uk: "Оберіть додаткові компоненти"
    body_en: "Setup now offers the local AI model, the call agent and the link downloader with their sizes. You haven't chosen yet."
    body_uk: "Перше налаштування тепер пропонує локальну модель AI, агента дзвінка і завантажувач посилань з їхніми розмірами. Ви ще не обирали."
    setup_step: addons
  - id: practice
    version: 0.16.0
    title_en: "A practice call"
    title_uk: "Тренувальний дзвінок"
    body_en: "A short sample conversation in the tips window, so you see where tips appear. Nothing is recorded or saved."
    body_uk: "Коротка зразкова розмова у вікні підказок, щоб побачити, де зʼявляються підказки. Нічого не записується і не зберігається."
    try: demo
  - id: updates
    version: 0.16.0
    title_en: "Updates from inside Pacenote"
    title_uk: "Оновлення всередині Pacenote"
    body_en: "Pacenote checks twice a day, downloads in the background and asks before it restarts. Never during a call. Settings › About › Updates."
    body_uk: "Pacenote перевіряє двічі на день, завантажує у фоні і питає перед перезапуском. Ніколи під час дзвінка. Налаштування › Про застосунок › Оновлення."
  - id: quiet_index
    version: 0.16.2
    title_en: "Quieter in the background"
    title_uk: "Тихіше у фоні"
    body_en: "When a file changes, Pacenote re-reads only the parts that changed, on two cores and at low priority. The first change of each file after this update is read in full once."
    body_uk: "Коли файл змінюється, Pacenote перечитує лише змінені частини, на двох ядрах і з низьким пріоритетом. Першу зміну кожного файлу після оновлення буде прочитано повністю один раз."
  - id: organizations
    version: 0.17.0
    title_en: "Organizations"
    title_uk: "Організації"
    body_en: "Join your team's organization from an invite on Home. Each call says who can see it, and a call can be private. Settings › Account."
    body_uk: "Приєднуйтесь до організації команди із запрошення на Home. Кожен дзвінок каже, хто його бачить, і дзвінок можна зробити приватним. Налаштування › Акаунт."
  - id: org_projects
    version: 0.17.0
    title_en: "Shared projects"
    title_uk: "Спільні проєкти"
    body_en: "A project linked to an organization project shares its card, state, sources and file index, and the Tracker shows colleagues' decisions, tasks and risks. Their calls stay theirs."
    body_uk: "Проєкт, прив'язаний до проєкту організації, ділиться карткою, станом, джерелами й індексом файлів, а Tracker показує рішення, задачі й ризики колег. Їхні дзвінки лишаються їхніми."
  - id: console_tab
    version: 0.17.0
    title_en: "Console in the app"
    title_uk: "Консоль у застосунку"
    body_en: "If you run something in an organization, Console next to Home and Tracker opens its people, teams and projects. No extra sign-in."
    body_uk: "Якщо ви щось керуєте в організації, Console поруч із Home і Tracker відкриває її людей, команди й проєкти. Без окремого входу."
  - id: new_project
    version: 0.17.0
    title_en: "New project, step by step"
    title_uk: "Новий проєкт крок за кроком"
    body_en: "Settings › Projects › Add › New project… asks for the name, where calls go, a folder and a short card. A sample project shows how it all looks."
    body_uk: "Налаштування › Проєкти › Додати › Новий проєкт… питає назву, куди йдуть дзвінки, папку і коротку картку. Приклад проєкту показує, як це виглядає."
  - id: stay_signed_in
    version: 0.17.1
    title_en: "Stays signed in after sleep"
    title_uk: "Вхід не злітає після сну"
    body_en: "If your Mac sleeps right while Pacenote renews its sign-in, you stay signed in to the Pacenote server."
    body_uk: "Якщо Мак засинає саме тоді, коли Pacenote оновлює вхід, ви лишаєтесь у Pacenote-акаунті."
