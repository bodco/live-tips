# What's new (Pacenote 0.16.0, D3). After the first launch of a new version the app shows the items newer than the
# last version this person saw, that apply to them (`when`) and, for a setup step, that they have not done yet.
# A new person does not see the current version's items after the onboarding; the full list is Settings > Help >
# What's new. Read by LiveTipsCore/WhatsNew.swift (a small YAML subset: one `key: value` per line, plain or
# double-quoted values, no multi-line values).
#
# Fields: id, version (items in order, versions never go down), title_en, title_uk, body_en, body_uk (both
# languages always), try (a FeatureRegistry id in LiveTips/Features.swift), setup_step (an onboarding step: the item
# shows while it is not done; "addons" = optional components chosen or installed), when (comma list, all must hold:
# provider:claude, provider:chatgpt, module:tracker, os:15; empty = everyone).
# CoreChecks (whatsNewD3): EN and UK for every item, `try` exists in FeatureRegistry, versions do not go down.
schema_version: 1
items:
  - id: settings_search
    version: 0.15.0
    title_en: "Settings search"
    title_uk: "Пошук у Налаштуваннях"
    body_en: "Press ⌘F in Settings and type \"key\", \"Notion\" or \"language\"."
    body_uk: "Натисніть ⌘F у Налаштуваннях і введіть «ключ», «Notion» або «мова»."
    try: settingsSearch
  - id: components
    version: 0.16.0
    title_en: "Settings › Components"
    title_uk: "Налаштування › Компоненти"
    body_en: "See what Pacenote installed on this Mac, how much space it takes, and remove what you don't use."
    body_uk: "Що Pacenote встановив на цей Мак, скільки місця це займає, і як прибрати те, чим ви не користуєтесь."
    try: components
  - id: addons
    version: 0.16.0
    title_en: "Choose optional add-ons"
    title_uk: "Оберіть додаткові компоненти"
    body_en: "Setup now offers the local AI model, the call agent and the link downloader with their sizes. You haven't chosen yet."
    body_uk: "Перше налаштування тепер пропонує локальну модель AI, агента дзвінка і завантажувач посилань з їхніми розмірами. Ви ще не обирали."
    setup_step: addons
  - id: practice
    version: 0.16.0
    title_en: "A practice call"
    title_uk: "Тренувальний дзвінок"
    body_en: "A short sample conversation in the tips window, so you see where tips appear. Nothing is recorded or saved."
    body_uk: "Коротка зразкова розмова у вікні підказок, щоб побачити, де зʼявляються підказки. Нічого не записується і не зберігається."
    try: demo
  - id: updates
    version: 0.16.0
    title_en: "Updates from inside Pacenote"
    title_uk: "Оновлення всередині Pacenote"
    body_en: "Pacenote checks twice a day, downloads in the background and asks before it restarts. Never during a call. Settings › About › Updates."
    body_uk: "Pacenote перевіряє двічі на день, завантажує у фоні і питає перед перезапуском. Ніколи під час дзвінка. Налаштування › Про застосунок › Оновлення."
  - id: quiet_index
    version: 0.16.2
    title_en: "Quieter in the background"
    title_uk: "Тихіше у фоні"
    body_en: "When a file changes, Pacenote re-reads only the parts that changed, on two cores and at low priority. The first change of each file after this update is read in full once."
    body_uk: "Коли файл змінюється, Pacenote перечитує лише змінені частини, на двох ядрах і з низьким пріоритетом. Першу зміну кожного файлу після оновлення буде прочитано повністю один раз."
  - id: organizations
    version: 0.17.0
    title_en: "Organizations"
    title_uk: "Організації"
    body_en: "Join your team's organization from an invite on Home. Each call says who can see it, and a call can be private. Settings › Account."
    body_uk: "Приєднуйтесь до організації команди із запрошення на Home. Кожен дзвінок каже, хто його бачить, і дзвінок можна зробити приватним. Налаштування › Акаунт."
  - id: org_projects
    version: 0.17.0
    title_en: "Shared projects"
    title_uk: "Спільні проєкти"
    body_en: "A project linked to an organization project shares its card, state, sources and file index, and the Tracker shows colleagues' decisions, tasks and risks. Their calls stay theirs."
    body_uk: "Проєкт, прив'язаний до проєкту організації, ділиться карткою, станом, джерелами й індексом файлів, а Tracker показує рішення, задачі й ризики колег. Їхні дзвінки лишаються їхніми."
  - id: console_tab
    version: 0.17.0
    title_en: "Console in the app"
    title_uk: "Консоль у застосунку"
    body_en: "If you run something in an organization, Console next to Home and Tracker opens its people, teams and projects. No extra sign-in."
    body_uk: "Якщо ви щось керуєте в організації, Console поруч із Home і Tracker відкриває її людей, команди й проєкти. Без окремого входу."
  - id: new_project
    version: 0.17.0
    title_en: "New project, step by step"
    title_uk: "Новий проєкт крок за кроком"
    body_en: "Settings › Projects › Add › New project… asks for the name, where calls go, a folder and a short card. A sample project shows how it all looks."
    body_uk: "Налаштування › Проєкти › Додати › Новий проєкт… питає назву, куди йдуть дзвінки, папку і коротку картку. Приклад проєкту показує, як це виглядає."
  - id: stay_signed_in
    version: 0.17.1
    title_en: "Stays signed in after sleep"
    title_uk: "Вхід не злітає після сну"
    body_en: "If your Mac sleeps right while Pacenote renews its sign-in, you stay signed in to the Pacenote server."
    body_uk: "Якщо Мак засинає саме тоді, коли Pacenote оновлює вхід, ви лишаєтесь у Pacenote-акаунті."
  - id: console_in_app
    version: 0.17.2
    title_en: "Manage organization opens in Pacenote"
    title_uk: "Керування організацією відкривається в Pacenote"
    body_en: "Manage organization in Settings > Account and Open the console in the organization setup now open the Console tab, already signed in."
    body_uk: "Керувати організацією в Налаштуваннях > Акаунт і Відкрити консоль у налаштуванні організації тепер відкривають вкладку Консоль, вже з входом."
  - id: plans_in_app
    version: 0.19.0
    title_en: "Compare and change plans in Pacenote"
    title_uk: "Порівняння і зміна планів у Pacenote"
    body_en: "Settings > Account > Plan shows every plan with what it includes and its limits. Owners and admins can switch the organization's plan there. Everything is free in the beta."
    body_uk: "Налаштування > Акаунт > План показує кожен план, що він містить і які в нього ліміти. Власники й адміністратори можуть там змінити план організації. У бета все безкоштовно."
  - id: product_analytics
    version: 0.19.0
    title_en: "Help improve Pacenote counts screens and errors"
    title_uk: "Допомога покращити Pacenote рахує екрани і помилки"
    body_en: "Pacenote sends which screens and features are used, errors by code and speed, never the words of a call. You can turn it off in Settings > General > Privacy, and Show what is sent lists exactly what goes out."
    body_uk: "Pacenote надсилає, які екрани й функції використовують, помилки за кодом і швидкість, ніколи не слова дзвінка. Вимкнути можна в Налаштуваннях > Загальні > Приватність, а Показати, що надсилається, перелічує все до дрібниць."
  - id: prep_failed_says_so
    version: 0.19.0
    title_en: "A failed preparation says so"
    title_uk: "Збій підготовки більше не мовчить"
    body_en: "If the brief for the call you just joined cannot be prepared, the tips window and Home show the reason and Try again, instead of saying no brief was started."
    body_uk: "Якщо бриф для дзвінка, до якого ви щойно приєднались, не вдалось підготувати, вікно підказок і Home показують причину і Спробувати ще раз, а не кажуть, що брифу не було."
  - id: refresh_calendars
    version: 0.19.0
    title_en: "Refresh calendars by hand"
    title_uk: "Оновити календарі вручну"
    body_en: "A round arrow next to Coming up on Home (also Command R) and in the menu bar panel reads your calendars again at once, so a meeting added a minute ago shows up in time."
    body_uk: "Кругла стрілка біля Coming up на Home (також Command R) і в панелі меню миттєво перечитує календарі, тож зустріч, додана хвилину тому, з'являється вчасно."
  - id: recorded_call_stops
    version: 0.19.1
    title_en: "A recorded call stops when the meeting ends"
    title_uk: "Дзвінок із записом зупиняється, коли мітинг закінчився"
    body_en: "Hang up in the meeting and Pacenote ends the call by itself, also when you record the screen, video with sound or sound only, or run the macOS screen recording."
    body_uk: "Поклали трубку в мітингу, і Pacenote сам завершує дзвінок, також коли ви записуєте екран, відео зі звуком або лише звук чи вмикаєте запис екрана macOS."
  - id: team_tab
    version: 0.20.0
    title_en: "Team tab for team leads"
    title_uk: "Вкладка Команда для лідів"
    body_en: "Team leads, and C-level on Enterprise, see their people's calls in one list with filters, search and an overview by week. Private calls show only the person, the date and the length."
    body_uk: "Ліди команд, а на Enterprise і C-level, бачать дзвінки своїх людей в одному списку з фільтрами, пошуком і оглядом по тижнях. Приватні дзвінки показують лише людину, дату і тривалість."
  - id: who_viewed
    version: 0.20.0
    title_en: "Who viewed my calls"
    title_uk: "Хто переглядав мої дзвінки"
    body_en: "Settings > Account lists who opened your calls in the last 90 days."
    body_uk: "Налаштування > Акаунт показує, хто відкривав ваші дзвінки за останні 90 днів."
  - id: sales_methods
    version: 0.21.0
    title_en: "More sales methods"
    title_uk: "Більше методів продажу"
    body_en: "MEDDPICC, GPCTBA/C&I, SPIN, Sandler and Challenger join BANT, SPICED and MEDDIC. In Sales mode Pacenote also follows stakeholders, the mutual action plan, competitors and prices."
    body_uk: "MEDDPICC, GPCTBA/C&I, SPIN, Sandler і Challenger поруч із BANT, SPICED і MEDDIC. У режимі продажу Pacenote також стежить за стейкхолдерами, спільним планом дій, конкурентами і цінами."
  - id: speech_writer
    version: 0.21.0
    title_en: "A speech for your deck"
    title_uk: "Промова до вашого деку"
    body_en: "Ask the live-tips skill \"write my talk\": what to say on every slide, with its time. Prepare for a Presentation call with that deck keeps your wording."
    body_uk: "Попросіть скіл live-tips \"напиши промову\": що казати на кожному слайді і скільки часу. Підготовка до дзвінка Presentation з цим деком зберігає ваші слова."
  - id: email_sign_in
    version: 0.22.0
    title_en: "Sign in with email and password"
    title_uk: "Вхід через email і пароль"
    body_en: "Sign in with email and password next to Google. A new account is confirmed with an 8-digit code from the email, and Forgot password? sets a new one. Settings > Account > Sign-in methods."
    body_uk: "Вхід через email і пароль поруч із Google. Новий акаунт підтверджується 8-значним кодом із листа, а Забули пароль? задає новий. Налаштування > Акаунт > Способи входу."
  - id: sign_in_first
    version: 0.22.0
    title_en: "Pacenote now needs an account"
    title_uk: "Pacenote тепер потребує акаунта"
    body_en: "The sign-in screen comes first and comes back when the session ends, never during a call. Audio and transcripts still stay on this Mac."
    body_uk: "Екран входу зʼявляється першим і повертається, коли сесія закінчилась, ніколи під час дзвінка. Аудіо і транскрипти, як і раніше, лишаються на цьому Маку."
  - id: three_looks
    version: 0.23.0
    title_en: "Three looks: Classic, Roadbook and Broadsheet"
    title_uk: "Три вигляди: Classic, Roadbook і Broadsheet"
    body_en: "Pick a style and a mode (Same as the Mac, Light or Dark) in Settings › General › Appearance. Colors, fonts, buttons and the tips window change at once; the new screen layouts come in the next releases."
    body_uk: "Оберіть стиль і режим (Як на Маку, Світла чи Темна) у Налаштування › Загальні › Вигляд. Кольори, шрифти, кнопки і вікно підказок змінюються одразу; нові розкладки екранів прийдуть у наступних релізах."
  - id: update_window
    version: 0.23.0
    title_en: "A new version says so"
    title_uk: "Нова версія повідомляє про себе"
    body_en: "When a new Pacenote is out, a window with what is new opens at launch, and a banner at the top of Home offers Install. Never during a call."
    body_uk: "Коли виходить новий Pacenote, під час запуску відкривається вікно з тим, що нового, а плашка вгорі Home пропонує Встановити. Ніколи під час дзвінка."
  - id: home_layout
    version: 0.24.0
    title_en: "A new Home"
    title_uk: "Новий Home"
    body_en: "Home has the new layout in every style: your next call large on top with Get ready or Start call, the rest of today and tomorrow next to it, then Recent calls and This week. Banners and things to set up sit in one place."
    body_uk: "Home має нову розкладку в кожному стилі: наступний дзвінок великим блоком угорі з Get ready або Start call, поруч решта сьогодні і завтра, нижче Recent calls і This week. Банери і те, що треба налаштувати, в одному місці."
  - id: update_one_click
    version: 0.24.0
    title_en: "Updates in one click"
    title_uk: "Оновлення одним кліком"
    body_en: "A new version opens its window within the hour, also while Pacenote is running. Install and restart now works with one click: a spinner while it downloads and installs, then Pacenote opens again."
    body_uk: "Нова версія відкриває своє вікно протягом години, навіть коли Pacenote вже працює. Install and restart тепер працює одним кліком: спінер, поки оновлення завантажується і ставиться, потім Pacenote відкривається знову."
  - id: one_install
    version: 0.25.0
    title_en: "Setup in one go"
    title_uk: "Встановлення за один раз"
    body_en: "One Install puts everything a call needs in place, with its own Python and one loader with MB and time left. Accounts install their program when you connect them, without Terminal."
    body_uk: "Один Install ставить усе, що потрібно дзвінку, з власним Python і одним лоадером з МБ і часом, що лишився. Акаунти ставлять свою програму, коли ви їх підключаєте, без Терміналу."
  - id: call_ready
    version: 0.25.0
    title_en: "Calls start only when they can work"
    title_uk: "Дзвінок стартує, лише коли може працювати"
    body_en: "If speech recognition or the tips engine is missing, the start button says so and installs it in place. Help > Export diagnostics saves the logs for support."
    body_uk: "Якщо бракує розпізнавання мовлення чи рушія підказок, кнопка старту каже про це і ставить їх на місці. Help > Експорт діагностики зберігає логи для підтримки."
  - id: call_pages_redrawn
    version: 0.25.0
    title_en: "Call pages, redrawn"
    title_uk: "Сторінки дзвінків по-новому"
    body_en: "An upcoming call without a Meeting Sheet offers Quick prep and Expert prep side by side. A past call opens on Decisions with who decided, Next steps and Risks, and the follow-up email is its own tab: copy it or open it in Mail, nothing is sent."
    body_uk: "Майбутній дзвінок без Meeting Sheet пропонує Quick prep і Expert prep поруч. Минулий дзвінок відкривається на Decisions із тим, хто вирішив, Next steps і Risks, а лист після дзвінка став окремою вкладкою: скопіюйте його або відкрийте в Mail, нічого не надсилається."
  - id: sheet_prep_redrawn
    version: 0.25.0
    title_en: "Preparing a Meeting Sheet, redrawn"
    title_uk: "Підготовка Meeting Sheet по-новому"
    body_en: "Start a call is now a few numbered sections, and the Quick and Expert steps show what is set and what is missing. When the sources are too big for one pass, you choose right on the page: 2 passes, summarize big sources first, remove some or use a route with a bigger window."
    body_uk: "Start a call тепер складається з кількох пронумерованих розділів, а кроки Quick і Expert показують, що вже налаштовано і чого бракує. Коли джерела завеликі для одного проходу, ви обираєте просто на сторінці: 2 проходи, спершу стиснути великі джерела, прибрати частину або взяти маршрут із більшим вікном."
  - id: tip_key_detail_source
    version: 0.25.0
    title_en: "Tips you read at a glance"
    title_uk: "Підказки, які читаються з першого погляду"
    body_en: "A tip now has one strong key line, a quieter detail under it, the ready phrase in quotes and where it comes from at the bottom. The newest tip stands out in the tips window."
    body_uk: "Підказка тепер має один виразний ключовий рядок, тихішу деталь під ним, готову фразу в лапках і внизу джерело, звідки вона. Найновіша підказка виділяється у вікні підказок."
  - id: compact_tip_card
    version: 0.25.0
    title_en: "A compact tip card under the camera"
    title_uk: "Компактна картка підказок під камерою"
    body_en: "Settings > General > Advanced > Calls > Live tips during a call: choose Compact card. One tip at a time sits just under the camera, so your eyes stay near the lens, and Expand opens the full tips window."
    body_uk: "Налаштування > Загальні > Додатково > Дзвінки > Підказки під час дзвінка: оберіть Компактна картка. Одна підказка за раз стоїть просто під камерою, тож погляд лишається біля обʼєктива, а Expand відкриває повне вікно підказок."
  - id: connect_notion
    version: 0.26.0
    title_en: "Connect with Notion"
    title_uk: "Connect with Notion"
    body_en: "Settings > Integrations > Notion connects through Notion's own consent in the browser instead of a pasted key. Pacenote makes its own Pacenote page with the databases it needs, and can keep a local copy of Notion without Control Tower."
    body_uk: "Налаштування > Integrations > Notion підключається через власну згоду Notion у браузері замість вставленого ключа. Pacenote робить свою сторінку Pacenote з потрібними базами і може тримати локальну копію Notion без Control Tower."
  - id: notices_inline
    version: 0.26.0
    title_en: "No pop-ups during a call"
    title_uk: "Без спливних вікон під час дзвінка"
    body_en: "Messages and questions now appear where you are: a line on the card, a strip in the tips window, a banner in Home or the menu bar panel. Nothing takes the focus from your meeting app, and a Notion problem says what to fix."
    body_uk: "Повідомлення і питання тепер зʼявляються там, де ви: рядок у картці, смужка у вікні підказок, банер у Home або панель menu bar. Ніщо не забирає фокус із застосунку зустрічі, а проблема з Notion каже, що виправити."
  - id: tips_header
    version: 0.26.0
    title_en: "One header in the tips window"
    title_uk: "Одна шапка у вікні підказок"
    body_en: "The timer, On me, the tools and End call sit in one header across the whole window, and Who said this? on an unknown voice offers names right away."
    body_uk: "Таймер, On me, інструменти і End call тепер в одній шапці на всю ширину вікна, а Who said this? на невідомому голосі одразу пропонує імена."
  - id: meeting_recap
    version: 0.26.1
    title_en: "What happened on the call"
    title_uk: "Що було на дзвінку"
    body_en: "The Summary of a past call starts with a short numbered list of what happened, told the way you would retell it to a colleague who missed the call."
    body_uk: "Summary минулого дзвінка починається з короткого пронумерованого списку того, що було, так, як ви б переказали це колезі, що пропустив дзвінок."
  - id: call_folders
    version: 0.26.2
    title_en: "A folder for every call"
    title_uk: "Окрема папка для кожного дзвінка"
    body_en: "Each call now has its own folder in the project's live folder: the transcript, notes, brief and sheet on top, the working files hidden inside. Old calls move there by themselves at launch, nothing is deleted."
    body_uk: "Кожен дзвінок тепер має власну папку в live проєкту: нагорі транскрипт, нотатки, бриф і sheet, робочі файли сховані всередині. Старі дзвінки переїжджають туди самі під час запуску, нічого не видаляється."
  - id: speakers_call_page
    version: 0.26.2
    title_en: "Fix the speakers after the call"
    title_uk: "Мовців можна виправити після дзвінка"
    body_en: "On a call page's Transcript, click a name to rename, merge or remember the voice, or right-click a line and pick Said by. Then Rewrite notes writes the notes again with the right names."
    body_uk: "У вкладці Transcript сторінки дзвінка клікніть імʼя, щоб перейменувати, обʼєднати чи запамʼятати голос, або правий клік на рядку і Said by. Потім Rewrite notes напише нотатки заново з правильними іменами."
  - id: fixes_0263
    version: 0.26.3
    title_en: "Fixes from the beta"
    title_uk: "Виправлення з бети"
    body_en: "The side panel of the tips window works again. Meeting notes, the Meeting Sheet and Notion no longer fail with \"No module named\" after a first setup that went wrong: Pacenote checks its Python and fixes it. Picking the work folder during setup no longer breaks the install. End call pressed twice ends the call. The search engine sleeps between uses."
    body_uk: "Бічна панель вікна підказок знову працює. Нотатки зустрічі, Meeting Sheet і Notion більше не падають з \"No module named\" після невдалого першого налаштування: Pacenote перевіряє свій Python і виправляє його. Вибір робочої папки під час налаштування більше не ламає встановлення. Повторне натискання End call завершує дзвінок. Пошуковий рушій засинає між використаннями."
